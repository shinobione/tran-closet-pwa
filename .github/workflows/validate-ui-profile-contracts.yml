name: Validate UI and Profile contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check relevant JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/taxonomy.generated.mjs
          node --check js/live-airtable-sync.js
          node --check js/photo-picker.js
          node --check js/closet-search-core.mjs
          node --check js/closet-search.js
          node --check js/i18n.js
          node --check js/i18n-keyed.mjs
          node --check js/build-version.js
          node --check js/sync-diagnostics.js
          node --check js/bootstrap.js
          node --check worker/src/taxonomy.generated.mjs
          node --check worker/src/v058.js
          node --check worker/src/v059.js
          node --check scripts/generate-taxonomy.mjs
          node --check scripts/test-taxonomy.mjs
          node --check scripts/test-ci-topology.mjs
          node --check scripts/test-repository-governance.mjs
          node --check scripts/test-branding-sources.mjs
          bash -n scripts/commit-generated-artifacts.sh
          node --check sw.js

      - name: Check live mobile and photo source contracts
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          grep -q "live-airtable-sync.js?v=${RELEASE}" js/bootstrap.js
          grep -q "photo-picker.js?v=${RELEASE}" js/bootstrap.js
          grep -q "url.pathname==='/v1/items'" worker/src/v058.js
          grep -q "AIRTABLE_READ_PAT" .github/workflows/deploy-worker.yml
          grep -q "camera.id='cameraInput'" js/photo-picker.js
          grep -q "camera.setAttribute('capture','environment')" js/photo-picker.js
          grep -q "input.removeAttribute('capture')" js/photo-picker.js
          grep -q "data-photo-camera" js/photo-picker.js
          grep -q "data-photo-gallery" js/photo-picker.js
          grep -q "input.dataset.photo=photo" js/photo-picker.js
          grep -q "icon-192.png?v=${RELEASE}" manifest.webmanifest
          grep -q "apple-touch-icon.png?v=${RELEASE}" index.html
          grep -q "const CACHE_PREFIX='tran-closet-'" sw.js
          grep -q 'shortSha' sw.js

      - name: Check non destructive canonical search
        run: |
          grep -q "#searchInput" js/closet-search.js
          grep -q "event.stopImmediatePropagation()" js/closet-search.js
          grep -q "card.hidden=!show" js/closet-search.js
          grep -q "FR_LABELS" js/closet-search-core.mjs
          ! grep -q "focus({preventScroll:true})" js/closet-search.js
          ! grep -q "state.query=e.target.value;render()" js/closet-search.js

      - name: Check canonical taxonomy and fine-color Worker
        run: |
          node scripts/generate-taxonomy.mjs
          node scripts/test-taxonomy.mjs
          grep -q "taxonomy.generated.mjs?v=0.5.16" js/data.js
          grep -q "from './taxonomy.generated.mjs'" worker/src/index.js
          grep -q "from './taxonomy.generated.mjs'" worker/src/v059.js
          grep -q "const COLORS=TAXONOMY.colors" worker/src/v059.js
          grep -q 'canonical-v${TAXONOMY_SCHEMA_VERSION}' worker/src/v059.js
          grep -q "main = \"src/v059.js\"" worker/wrangler.toml
          grep -q "detectFineColors" worker/src/v059.js
          grep -q "Use Navy for very dark blue" worker/src/v059.js
          grep -q "Distinguish Beige, Cream and White" worker/src/v059.js
          grep -q "Verify canonical taxonomy parity" .github/workflows/deploy-worker.yml
          grep -q "node scripts/test-taxonomy.mjs" .github/workflows/deploy-worker.yml

      - name: Check deployment version and Profile observer stability
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          echo "$VERSION_VALUE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -q "version:'${VERSION_VALUE}'" js/build-version.js
          grep -q "git rev-parse HEAD" .github/workflows/deploy-pages.yml
          grep -q "build-info.json" .github/workflows/deploy-pages.yml
          grep -q "cache:'no-store'" js/build-version.js
          grep -q "TranClosetBuildInfo" js/build-version.js
          grep -q "build-info.json" sw.js
          grep -q "build:{sha:" js/sync-diagnostics.js
          grep -q "card.dataset.buildSignature===signature" js/build-version.js
          grep -q "if(summary.textContent!==next)summary.textContent=next" js/sync-diagnostics.js
          grep -q "observe(main,{childList:true})" js/build-version.js
          grep -q "observe(main,{childList:true})" js/sync-diagnostics.js
          ! grep -q "subtree:true" js/build-version.js
          ! grep -q "subtree:true" js/sync-diagnostics.js
          test ! -e js/i18n-runtime-compat.js
          ! grep -q "i18n-runtime-compat.js" js/bootstrap.js
          ! grep -q "i18n-runtime-compat.js" sw.js
          grep -q "v059-ux.css?v=${RELEASE}" index.html
          grep -q "v0510-ux.css?v=${RELEASE}" index.html
          grep -q "photo-picker.js?v=${RELEASE}" js/bootstrap.js
          grep -q "closet-search.js?v=${RELEASE}" js/bootstrap.js
          grep -q "app.js?v=${RELEASE}" js/bootstrap.js
          grep -q "outfit-picker.js?v=${RELEASE}" js/bootstrap.js
          grep -q "build-version.js?v=${RELEASE}" js/bootstrap.js
          grep -q "sync-diagnostics.js?v=${RELEASE}" js/bootstrap.js
          grep -q "closet-search-core.mjs?v=${RELEASE}" sw.js
          grep -q "closet-search.js?v=${RELEASE}" sw.js
          grep -q "i18n-keyed.mjs?v=${RELEASE}" sw.js

      - name: Check French Profile and legacy retry coverage
        run: |
          grep -q "Synchronisation configurée" js/i18n.js
          grep -q "Adresse du Worker" js/i18n.js
          grep -q "Clé de synchronisation" js/i18n.js
          grep -q "Réinitialiser les données locales" js/i18n.js
          grep -q "AI đã tự thử lại" js/i18n.js
          grep -q "L’IA a réessayé" js/i18n.js
          grep -q "Đang tự thử lại" js/i18n.js
          grep -q "Nouvel essai automatique" js/i18n.js
          grep -q "'diagnostics.title':'Diagnostic de synchronisation'" js/i18n-keyed.mjs
          grep -q "'daily.openSaved':'Ouvrir dans Tenues'" js/i18n-keyed.mjs

      - name: Guard canonical branding sources
        run: node scripts/test-branding-sources.mjs --strict

      - name: Guard consolidated CI topology
        run: node scripts/test-ci-topology.mjs

      - name: Guard repository and deployment governance
        run: node scripts/test-repository-governance.mjs
