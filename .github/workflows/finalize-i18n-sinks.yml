name: Finalize V0.5.16 explicit i18n sinks

on:
  push:
    branches: [v0.5.16-i18n-dynamic-closeout]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip i18n-sinks]')) || (github.event_name == 'pull_request' && github.head_ref == 'v0.5.16-i18n-dynamic-closeout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.16-i18n-dynamic-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch explicit translation sinks
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='js/app.js';
          let s=fs.readFileSync(path,'utf8');
          function once(from,to){const n=s.split(from).length-1;if(n!==1)throw new Error(`Expected 1 occurrence, got ${n}: ${from}`);s=s.replace(from,to);}

          once(
            "function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2400);}",
            "function say(msg){const localized=window.TranClosetI18n?.t?.(msg)||msg;toast.textContent=localized;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2400);}"
          );
          once(
            "  bind();\n  window.TranClosetI18n?.apply?.(main);\n}",
            "  bind();\n  window.TranClosetI18n?.apply?.(main);\n  window.TranClosetI18n?.apply?.(title);\n}"
          );
          once(
            "    </form></div></div>`;\n  if(!itemDialog.open)itemDialog.showModal();",
            "    </form></div></div>`;\n  window.TranClosetI18n?.apply?.(itemDialog);\n  if(!itemDialog.open)itemDialog.showModal();"
          );
          once(
            "    </div></div>`;\n  itemDialog.showModal();",
            "    </div></div>`;\n  window.TranClosetI18n?.apply?.(itemDialog);\n  itemDialog.showModal();"
          );
          once(
            "    <div class=\"detail-actions three\"><button id=\"detailFav\" class=\"secondary-button\">${i.favorite?'♥':'♡'}</button><button id=\"detailEdit\" class=\"secondary-button\">Sửa</button><button id=\"detailDelete\" class=\"danger-button\">Xóa</button></div></div></div>`;\n  itemDialog.showModal();",
            "    <div class=\"detail-actions three\"><button id=\"detailFav\" class=\"secondary-button\">${i.favorite?'♥':'♡'}</button><button id=\"detailEdit\" class=\"secondary-button\">Sửa</button><button id=\"detailDelete\" class=\"danger-button\">Xóa</button></div></div></div>`;\n  window.TranClosetI18n?.apply?.(itemDialog);\n  itemDialog.showModal();"
          );
          once(
            "    </div></div>`;\n  itemDialog.querySelector('[data-close]').onclick=()=>itemDialog.close();\n  itemDialog.querySelector('#editItemForm')",
            "    </div></div>`;\n  window.TranClosetI18n?.apply?.(itemDialog);\n  itemDialog.querySelector('[data-close]').onclick=()=>itemDialog.close();\n  itemDialog.querySelector('#editItemForm')"
          );
          fs.writeFileSync(path,s);
          NODE
      - name: Validate explicit sinks
        run: |
          node --check js/app.js
          test "$(grep -c 'TranClosetI18n?.apply?.(itemDialog)' js/app.js)" -eq 4
          grep -q "TranClosetI18n?.apply?.(title)" js/app.js
          grep -q "TranClosetI18n?.t?.(msg)" js/app.js
          ! grep -q "observer.observe(document.body,{subtree:true" js/i18n.js
          node scripts/test-duplicate-core.mjs
          node scripts/test-keyed-i18n.mjs
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-i18n-sinks.yml
      - name: Commit runtime only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V0.5.16 · Bind explicit legacy i18n sinks [skip i18n-sinks]"
          git push origin HEAD:v0.5.16-i18n-dynamic-closeout
