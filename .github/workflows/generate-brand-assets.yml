name: Generate brand assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'branding/logo-source-round.b64.part*'
      - 'scripts/generate-brand-assets.py'
      - '.github/workflows/generate-brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'branding/logo-source-round.b64.part*'
      - 'scripts/generate-brand-assets.py'
      - '.github/workflows/generate-brand-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate favicon, PWA icons and splash
        run: python scripts/generate-brand-assets.py

      - name: Verify expected outputs
        run: |
          test -f branding/logo-lockup-centered.png
          test -f branding/logo-mark.png
          test -f branding/logo-mark-256.png
          test -f branding/splash-1242x2688.png
          test -f favicon.ico
          test -f icons/favicon-16.png
          test -f icons/favicon-32.png
          test -f icons/favicon-48.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/maskable-512.png
          test -f icons/apple-touch-icon.png

      - name: Commit generated brand assets when changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add branding/logo-lockup-centered.png branding/logo-mark.png branding/logo-mark-256.png branding/splash-1242x2688.png favicon.ico icons/favicon-16.png icons/favicon-32.png icons/favicon-48.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'Brand assets already current.'
          else
            git commit -m 'Generate canonical Trân Closet brand assets'
            git push origin HEAD:main
          fi
