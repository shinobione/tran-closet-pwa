name: Generate brand assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'branding/source-v057/**'
      - 'scripts/generate-brand-assets.py'
      - '.github/workflows/generate-brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'branding/source-v057/**'
      - 'scripts/generate-brand-assets.py'
      - '.github/workflows/generate-brand-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild supplied branding assets
        run: python scripts/generate-brand-assets.py

      - name: Verify V0.5.7 outputs
        run: |
          test -s branding/header-lockup.png
          test -s branding/logo-mark-v057.png
          test -s branding/logo-lockup-centered.png
          test -s branding/logo-mark.png
          test -s branding/logo-mark-256.png
          test -s branding/splash-1242x2688.png
          test -s favicon.ico
          test -s icons/favicon-16.png
          test -s icons/favicon-32.png
          test -s icons/favicon-48.png
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/maskable-512.png
          test -s icons/apple-touch-icon.png

      - name: Commit generated binaries to the candidate branch
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add branding/header-lockup.png branding/logo-mark-v057.png branding/logo-lockup-centered.png branding/logo-mark.png branding/logo-mark-256.png branding/splash-1242x2688.png favicon.ico icons/favicon-16.png icons/favicon-32.png icons/favicon-48.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'Generated branding already current.'
          else
            git commit -m "Generate V0.5.7 Trân's Closet brand assets"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
