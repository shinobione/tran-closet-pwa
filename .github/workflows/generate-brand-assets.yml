name: Generate brand assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'branding/favicon-user-v058.b64'
      - 'branding/header-lockup-v057.png'
      - 'branding/logo-mark-v057.png'
      - 'branding/splash-1242x2688.png'
      - 'scripts/generate-brand-assets.py'
      - 'scripts/test-branding-sources.mjs'
      - 'docs/BRANDING-SOURCES.md'
      - '.github/workflows/generate-brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'branding/favicon-user-v058.b64'
      - 'branding/header-lockup-v057.png'
      - 'branding/logo-mark-v057.png'
      - 'branding/splash-1242x2688.png'
      - 'scripts/generate-brand-assets.py'
      - 'scripts/test-branding-sources.mjs'
      - 'docs/BRANDING-SOURCES.md'
      - '.github/workflows/generate-brand-assets.yml'

permissions:
  contents: write

concurrency:
  group: generated-main-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Generate favicon and PWA icons from exact glossy user master
        run: python scripts/generate-brand-assets.py

      - name: Verify canonical branding sources
        run: node scripts/test-branding-sources.mjs --strict

      - name: Verify expected outputs
        run: |
          test -f branding/favicon-user-v058.b64
          test -f favicon.ico
          test -f icons/favicon-16.png
          test -f icons/favicon-32.png
          test -f icons/favicon-48.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/maskable-512.png
          test -f icons/apple-touch-icon.png
          test -f branding/header-lockup-v057.png
          test -f branding/logo-mark-v057.png
          test -f branding/splash-1242x2688.png

      - name: Verify generated icon outputs are committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- favicon.ico icons/favicon-16.png icons/favicon-32.png icons/favicon-48.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png

      - name: Commit generated system icons safely when changed
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: main
          GENERATED_COMMIT_MESSAGE: Generate exact glossy Trân Closet system icons
          GENERATED_FILES: favicon.ico icons/favicon-16.png icons/favicon-32.png icons/favicon-48.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png
          GENERATE_COMMAND: python scripts/generate-brand-assets.py
        run: bash scripts/commit-generated-artifacts.sh
