name: Build V0.5.7 exact brand assets

on:
  pull_request:
    branches: [main]
    paths:
      - 'branding/source-v057/**'
      - 'scripts/build-v057-brand.py'
      - '.github/workflows/build-v057-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild exact V0.5.7 assets
        run: python scripts/build-v057-brand.py

      - name: Verify outputs
        run: |
          test -s branding/header-lockup-v057.png
          test -s branding/logo-mark-v057.png
          test -s branding/splash-1242x2688.png
          test -s favicon.ico
          test -s icons/favicon-16.png
          test -s icons/favicon-32.png
          test -s icons/favicon-48.png
          test -s icons/apple-touch-icon.png
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/maskable-512.png

      - name: Commit generated binaries to the same branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add branding/header-lockup-v057.png branding/logo-mark-v057.png branding/splash-1242x2688.png favicon.ico icons/favicon-16.png icons/favicon-32.png icons/favicon-48.png icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png
          if git diff --cached --quiet; then
            echo 'Exact V0.5.7 binaries already current.'
          else
            git commit -m 'V0.5.7 generate exact user branding binaries'
            git push origin HEAD:${{ github.head_ref }}
          fi
