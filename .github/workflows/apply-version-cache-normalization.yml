name: Apply V0.5.16 version cache normalization

on:
  push:
    branches: [v0.5.16-version-cache-normalization]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip version-cache-normalize]')) || (github.event_name == 'pull_request' && github.head_ref == 'v0.5.16-version-cache-normalization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.16-version-cache-normalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch service worker registration
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='js/app.js';
          let source=fs.readFileSync(path,'utf8');
          const from="navigator.serviceWorker.register('./sw.js')";
          const to="navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})";
          const count=source.split(from).length-1;
          if(count!==1)throw new Error(`Expected exactly one service worker registration, got ${count}`);
          source=source.replace(from,to);
          fs.writeFileSync(path,source);
          NODE
      - name: Normalize release query refs from VERSION
        run: node scripts/normalize-release-refs.mjs --write
      - name: Validate normalized runtime
        run: |
          node --check js/app.js
          node --check sw.js
          node --check scripts/normalize-release-refs.mjs
          node --check scripts/test-version-cache.mjs
          node scripts/normalize-release-refs.mjs
          node scripts/test-version-cache.mjs
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-version-cache-normalization.yml
      - name: Commit normalized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V0.5.16 · Normalize runtime version/cache refs [skip version-cache-normalize]"
          git push origin HEAD:v0.5.16-version-cache-normalization
