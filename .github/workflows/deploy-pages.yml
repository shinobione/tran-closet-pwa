name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync Airtable closet']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release references and PWA cache contract
        run: |
          node scripts/normalize-release-refs.mjs
          node scripts/test-version-cache.mjs

      - name: Build exact deployment stamp
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const version=fs.readFileSync('VERSION','utf8').trim();
          const sha=cp.execSync('git rev-parse HEAD').toString().trim();
          const body={
            version,
            sha,
            shortSha:sha.slice(0,7),
            builtAt:new Date().toISOString(),
            runId:process.env.GITHUB_RUN_ID||null
          };
          fs.writeFileSync('build-info.json',JSON.stringify(body,null,2)+'\n');
          console.log(`Deploying ${body.version} @ ${body.shortSha}`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
