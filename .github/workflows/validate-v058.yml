name: Validate V0.5.8 mobile sync hotfix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-v058:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new JavaScript modules
        run: |
          node --check js/live-airtable-sync.js
          node --check js/photo-picker-mobile.js
          node --check worker/src/v058.js
      - name: Check integration contracts
        run: |
          grep -q "live-airtable-sync.js?v=0.5.8" js/bootstrap.js
          grep -q "photo-picker-mobile.js?v=0.5.8" js/bootstrap.js
          grep -q "removeAttribute('capture')" js/photo-picker-mobile.js
          grep -q "url.pathname==='/v1/items'" worker/src/v058.js
          grep -q "AIRTABLE_READ_PAT" .github/workflows/deploy-worker.yml
          grep -q "icon-192.png?v=0.5.8" manifest.webmanifest
          grep -q "apple-touch-icon.png?v=0.5.8" index.html
          grep -q "const CACHE = 'tran-closet-v0.5.1'" sw.js
