name: Validate Profile stability and QA UX

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-v0510:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/photo-picker.js
          node --check js/closet-search-core.mjs
          node --check js/closet-search.js
          node --check js/i18n-runtime-compat.js
          node --check js/build-version.js
          node --check js/sync-diagnostics.js
          node --check js/bootstrap.js
          node --check sw.js
      - name: Check photo source chooser
        run: |
          grep -q "camera.setAttribute('capture','environment')" js/photo-picker.js
          grep -q "input.removeAttribute('capture')" js/photo-picker.js
          grep -q "event.stopImmediatePropagation()" js/photo-picker.js
      - name: Check non destructive search
        run: |
          grep -q "event.stopImmediatePropagation()" js/closet-search.js
          grep -q "card.hidden=!show" js/closet-search.js
          grep -q "FR_LABELS" js/closet-search-core.mjs
          ! grep -q "state.query=e.target.value;render()" js/closet-search.js
      - name: Check reliable deployment version
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          echo "$VERSION_VALUE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -q "version:'${VERSION_VALUE}'" js/build-version.js
          grep -q "git rev-parse HEAD" .github/workflows/deploy-pages.yml
          grep -q "build-info.json" .github/workflows/deploy-pages.yml
          grep -q "cache:'no-store'" js/build-version.js
          grep -q "TranClosetBuildInfo" js/build-version.js
          grep -q "build-info.json" sw.js
          grep -q "build:{sha:" js/sync-diagnostics.js
      - name: Check profile observer stability
        run: |
          grep -q "card.dataset.buildSignature===signature" js/build-version.js
          grep -q "if(summary.textContent!==next)summary.textContent=next" js/sync-diagnostics.js
          grep -q "observe(main,{childList:true})" js/build-version.js
          grep -q "observe(main,{childList:true})" js/sync-diagnostics.js
          ! grep -q "subtree:true" js/build-version.js
          ! grep -q "subtree:true" js/sync-diagnostics.js
          test "$(grep -c 'new MutationObserver' js/i18n-runtime-compat.js)" -eq 1
          grep -q "characterData/attributes" js/i18n-runtime-compat.js
      - name: Check canonical runtime integration
        run: |
          test -f css/v0510-ux.css
          grep -q "v0510-ux.css?v=0.5.10" index.html
          grep -q "photo-picker.js?v=0.5.16" js/bootstrap.js
          grep -q "closet-search.js?v=0.5.16" js/bootstrap.js
          grep -q "i18n-runtime-compat.js?v=0.5.16" js/bootstrap.js
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          grep -q "build-version.js?v=${VERSION_VALUE#v}" js/bootstrap.js
          grep -q "sync-diagnostics.js?v=${VERSION_VALUE#v}" js/bootstrap.js
          grep -q "closet-search-core.mjs?v=0.5.16" sw.js
          grep -q "closet-search.js?v=0.5.16" sw.js
          grep -q "i18n-runtime-compat.js?v=0.5.16" sw.js
      - name: Check French profile coverage remains canonical
        run: |
          grep -q "Synchronisation configurée" js/i18n.js
          grep -q "Adresse du Worker" js/i18n.js
          grep -q "Clé de synchronisation" js/i18n.js
          grep -q "Réinitialiser les données locales" js/i18n.js
