name: Publish V0.5.17 runtime normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-normalization:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v0.5.17-wear-event-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.17-wear-event-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize and publish runtime files
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "v0.5.17"
          node scripts/normalize-release-refs.mjs --write
          rm -f .ci-v0517-kick
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- VERSION index.html manifest.webmanifest sw.js \
            js/app.js js/bootstrap.js js/build-version.js js/closet-search.js \
            js/daily-assistant-core.mjs js/daily-assistant.js js/data.js js/duplicate-guard.js \
            js/item-ai-assistant.js js/live-airtable-outfit-sync.js js/manual-sync.js \
            js/outfit-integrity-ui.js js/outfit-picker.js js/outfit-presentation.js js/outfit-sync-client.js \
            js/photo-picker.js js/sync-client.js js/sync-diagnostics.js js/wear-history-i18n.mjs js/wear-history.js
          git add -u -- .ci-v0517-kick || true
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'V0.5.17 · Normalize runtime release boundary'
          git push origin HEAD:v0.5.17-wear-event-foundation
