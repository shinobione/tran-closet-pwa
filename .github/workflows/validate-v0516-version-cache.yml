name: Validate V0.5.16 version and cache identity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-version-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check normalization tooling syntax
        run: |
          node --check scripts/normalize-release-refs.mjs
          node --check scripts/test-version-cache.mjs
          node --check scripts/test-pwa-isolation.mjs
          node --check worker/src/v061.js
          node --check sw.js
          node --check js/app.js

      - name: Reject release reference drift
        run: node scripts/normalize-release-refs.mjs

      - name: Test exact build cache and app-shell coherence
        run: node scripts/test-version-cache.mjs

      - name: Test PWA namespace isolation
        run: node scripts/test-pwa-isolation.mjs

      - name: Check Airtable API budget cache contract
        run: |
          grep -q 'main = "src/v061.js"' worker/wrangler.toml
          grep -q 'name = "SYNC_CACHE"' worker/wrangler.toml
          grep -q 'class_name = "CanonicalSyncCache"' worker/wrangler.toml
          grep -q 'new_sqlite_classes = \["CanonicalSyncCache"\]' worker/wrangler.toml
          grep -q 'CACHE_TTL_MS = 12 \* 60 \* 60 \* 1000' worker/src/v061.js
          grep -q "\['/v1/items', 'items'\]" worker/src/v061.js
          grep -q "\['/v1/outfits', 'outfits'\]" worker/src/v061.js
          grep -q "\['/v1/wear-events', 'wear-events'\]" worker/src/v061.js
          grep -q "\['/v1/mutations', 'items'\]" worker/src/v061.js
          grep -q "\['/v1/outfit-mutations', 'outfits'\]" worker/src/v061.js
          grep -q "\['/v1/wear-mutations', 'wear-events'\]" worker/src/v061.js
          grep -q "'x-tran-cache':'HIT'" worker/src/v061.js
          grep -q "'x-tran-cache':'MISS'" worker/src/v061.js
          grep -q "cron: '17 3 \* \* \*'" .github/workflows/sync-airtable.yml
          ! grep -q "cron: '17 \*/6 \* \* \*'" .github/workflows/sync-airtable.yml

      - name: Check deployment proof contract
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          echo "$VERSION_VALUE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -q "node scripts/normalize-release-refs.mjs" .github/workflows/deploy-pages.yml
          grep -q "node scripts/test-version-cache.mjs" .github/workflows/deploy-pages.yml
          grep -q "git rev-parse HEAD" .github/workflows/deploy-pages.yml
          grep -q "shortSha:sha.slice(0,7)" .github/workflows/deploy-pages.yml
          grep -q "build-info.json" .github/workflows/deploy-pages.yml
          grep -q "const CACHE_PREFIX='tran-closet-'" sw.js
          grep -q 'shortSha' sw.js
          grep -q "bootstrap.js?v=${RELEASE}" index.html
          grep -q "icon-192.png?v=${RELEASE}" manifest.webmanifest
          grep -q "updateViaCache:'none'" js/app.js
          ! grep -q "const CACHE = 'tran-closet-v0.5.1'" sw.js
