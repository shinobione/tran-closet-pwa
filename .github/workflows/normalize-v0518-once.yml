name: One-shot normalize v0.5.18 refs

on:
  push:
    branches: [v0.5.18-wear-history-sync]
    paths:
      - '.github/workflows/normalize-v0518-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.18-wear-history-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize release references
        run: |
          set -euo pipefail
          node scripts/normalize-release-refs.mjs --write

          cat > /tmp/expected-files.txt <<'EOF'
          index.html
          js/app.js
          js/bootstrap.js
          js/build-version.js
          js/closet-search.js
          js/daily-assistant-core.mjs
          js/daily-assistant.js
          js/data.js
          js/duplicate-guard.js
          js/item-ai-assistant.js
          js/live-airtable-outfit-sync.js
          js/live-airtable-wear-sync.js
          js/manual-sync.js
          js/outfit-integrity-ui.js
          js/outfit-picker.js
          js/outfit-presentation.js
          js/outfit-sync-client.js
          js/photo-picker.js
          js/sync-client.js
          js/sync-diagnostics.js
          js/wear-history-i18n.mjs
          js/wear-history.js
          js/wear-sync-client.js
          manifest.webmanifest
          sw.js
          EOF

          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          if ! diff -u /tmp/expected-files.txt /tmp/actual-files.txt; then
            echo 'Normalizer touched an unexpected file set.'
            exit 1
          fi

          rm .github/workflows/normalize-v0518-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            index.html \
            js/app.js \
            js/bootstrap.js \
            js/build-version.js \
            js/closet-search.js \
            js/daily-assistant-core.mjs \
            js/daily-assistant.js \
            js/data.js \
            js/duplicate-guard.js \
            js/item-ai-assistant.js \
            js/live-airtable-outfit-sync.js \
            js/live-airtable-wear-sync.js \
            js/manual-sync.js \
            js/outfit-integrity-ui.js \
            js/outfit-picker.js \
            js/outfit-presentation.js \
            js/outfit-sync-client.js \
            js/photo-picker.js \
            js/sync-client.js \
            js/sync-diagnostics.js \
            js/wear-history-i18n.mjs \
            js/wear-history.js \
            js/wear-sync-client.js \
            manifest.webmanifest \
            sw.js \
            .github/workflows/normalize-v0518-once.yml
          git diff --cached --check
          git commit -m 'Normalize v0.5.18 release refs'
          git push origin HEAD:v0.5.18-wear-history-sync
