name: Validate V0.5.15 CORS-safe delete reread

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-v0515:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/sync-client.js
          node --check js/sync-diagnostics.js
          node --check js/bootstrap.js
          node --check js/build-version.js
          node --check sw.js
      - name: Reject CORS-unsafe reconciliation headers
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('js/sync-client.js').read_text()
          assert "cache-control" not in source.lower(), 'client must not send Cache-Control cross-origin'
          assert "cache:'no-store'" in source, 'browser cache mode must remain no-store'
          assert "reconcileFailedDeletes" in source
          assert "/v1/items" in source
          worker=Path('worker/src/v058.js').read_text()
          assert "access-control-allow-headers':'authorization,content-type'" in worker
          print('CORS-safe canonical reread PASS')
          PY
      - name: Check fresh module wiring
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "v0.5.15"
          grep -q "sync-client.js?v=0.5.15" js/sync-diagnostics.js
          grep -q "sync-diagnostics.js?v=0.5.15" js/bootstrap.js
          grep -q "build-version.js?v=0.5.15" js/bootstrap.js
          grep -q "sync-client.js?v=0.5.15" sw.js
          grep -q "delete-reconciliation.mjs?v=0.5.15" sw.js
