name: Checkpoint V0.5.16 governance docs

on:
  push:
    branches: [v0.5.16-state-after-governance]
    paths:
      - '.github/workflows/checkpoint-governance-docs.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  checkpoint:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'v0.5.16-state-after-governance' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.16-state-after-governance
          fetch-depth: 0
      - name: Update canonical state
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def once(text,old,new,label):
            n=text.count(old)
            if n!=1: raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
            return text.replace(old,new)

          def section(text,start,end,replacement,label):
            pattern=re.compile(start+r'.*?(?='+end+r')',re.S|re.M)
            out,n=pattern.subn(replacement,text,count=1)
            if n!=1: raise SystemExit(f'{label}: expected 1 section, got {n}')
            return out

          p=Path('docs/PROJECT-STATE.md'); s=p.read_text()
          s=once(s,
            '- current runtime-changing main SHA: **`f748d0b62bc4f610009eee886d7c5e5689c80477`** — Slice 16.8 canonical taxonomy unification',
            '- current runtime-changing main SHA: **`a1689d14548c4ecbffe2e4b526d6db655f546ead`** — Slice 16.9 governance + search-safe silent sync',
            'runtime sha')
          lineage='- Slice 16.8 canonical taxonomy unification: PR **#62**, tested head **`35d1711f480d5e711462d442d2dcfd9b44249c78`**, squash merge **`f748d0b62bc4f610009eee886d7c5e5689c80477`** after **9/9 PR workflows SUCCESS**; canonical taxonomy **17 categories / 24 colors / 6 styles / 22 tags**, client=Worker, Airtable alias round-trip and system-Chrome smoke PASS.'
          s=once(s,lineage,lineage+'\n- Slice 16.9 repository/deployment governance: PR **#64**, tested head **`4927f447227991b23dc48d4e6b8923176dc0a433`**, squash merge **`a1689d14548c4ecbffe2e4b526d6db655f546ead`** after **9/9 PR validations SUCCESS** + branding generator SUCCESS; 17 stale branches removed, generated-main writers hardened, and the startup silent-sync search focus regression fixed with hardened Chrome proof.','lineage')
          s=once(s,
            '  - **16.9 repo/deployment governance:** 🔵 NEXT ACTIVE ENGINEERING SLICE',
            '  - **16.9 repo/deployment governance:** ✅ MERGED / 9/9 CI + BROWSER SMOKE GREEN; governance contract recorded, `main` protection state remains explicitly unprotected.\n  - **16.10 branding source cleanup:** 🔵 NEXT ACTIVE ENGINEERING SLICE',
            'slice status')
          governance='''### 16.9 — repo / deployment governance — MERGED / 9/9 GREEN\n\nDelivered by PR **#64**:\n- repository governance vocabulary separates MERGED / PAGES DEPLOYED / WORKER DEPLOYED / VERIFIED PROD;\n- current `main` protection state is recorded factually as unprotected rather than falsely claimed enabled;\n- permanent generated-content writers are restricted to Airtable snapshot sync + branding generation;\n- both generated writers share `generated-main-writes` concurrency and use `scripts/commit-generated-artifacts.sh`;\n- generated writes always restart from latest `origin/main`, commit only allowlisted generated paths, never force-push and retry normal push races;\n- governance CI rejects extra `contents: write` writers, direct/force generated pushes and workflow self-mutation;\n- audited fail-closed cleanup removed **17** stale/no-op/merged branches; after cleanup the repo had only `main` + the active governance branch;\n- scheduled Airtable snapshot movement advanced `main` during PR #64 and the candidate was tested successfully against the updated merge ref;\n- hardened Chrome smoke exposed a real pre-existing startup search-focus loss caused by `setTimeout(()=>syncNow(true),700)` rerendering the route while typing;\n- startup and `online` silent sync now use `syncWhenSearchIdle()`, deferring rerender until search blur instead of forced refocus;\n- hardened browser proof types `Melo`, pauses 250 ms, then types `dy` without another click and requires `Melody`;\n- final tested head **`4927f447227991b23dc48d4e6b8923176dc0a433`** passed **9/9** PR validations plus branding generation before squash merge **`a1689d14548c4ecbffe2e4b526d6db655f546ead`**.\n\nBranch protection/ruleset was not enabled: the available connector does not expose a safe mutation while preserving the two legitimate generated-main writers. This is documented governance, not an unverified claim. Final installed-device search/sync behavior remains part of Slice 16.11.\n\n'''
          s=section(s,r'^### 16\.9 — repo / deployment governance\n',r'^### 16\.10 — branding source clutter\n',governance,'16.9 section')
          s=once(s,
            '10. **16.9 repo/deployment governance — 🔵 NEXT ACTIVE**\n11. 16.10 branding source cleanup',
            '10. 16.9 repo/deployment governance — ✅ merged / 9-of-9 CI + browser smoke green\n11. **16.10 branding source cleanup — 🔵 NEXT ACTIVE**',
            'ordered plan')
          next_action='''## Next canonical action\n\n### Slice 16.10 — branding source cleanup\n\n1. inventory all branding masters, generated outputs and every runtime/workflow/script reference;\n2. preserve the approved current identity exactly — no redesign, recolor, recrop or artistic regeneration;\n3. identify canonical favicon/header/logo/splash sources and distinguish runtime masters from obsolete historical intermediates;\n4. remove only assets proven dependency-free after repo-wide checks;\n5. keep deterministic favicon/PWA icon generation from the approved source with checksum protection;\n6. add CI/governance guards so retired branding sources cannot silently return and canonical assets cannot disappear;\n7. verify HTML/CSS/manifest/Service Worker/generator wiring plus browser smoke before merge.\n\n---\n\n'''
          s=section(s,r'^## Next canonical action\n',r'^## Verification vocabulary\n',next_action,'next action')
          s=s.replace('strict product QA for 16.2/16.3/16.4/16.5/16.6 plus deployment proof affected by 16.8 is accumulated','strict product QA for 16.2/16.3/16.4/16.5/16.6 plus deployment proof affected by 16.8 and installed-device search/sync proof affected by 16.9 is accumulated')
          p.write_text(s)

          p=Path('docs/ROADMAP.md'); r=p.read_text()
          r=once(r,
            'Current slice: **V0.5.16 · Slice 16.9 — repository / deployment governance**',
            'Current slice: **V0.5.16 · Slice 16.10 — branding source cleanup**',
            'roadmap current')
          governance='''## Slice 16.9 — Repository / deployment governance ✅ MERGED / 9/9 GREEN\n\nPR **#64**, tested head **`4927f447227991b23dc48d4e6b8923176dc0a433`**, squash merge **`a1689d14548c4ecbffe2e4b526d6db655f546ead`**.\n\nDelivered:\n- explicit repository governance and deployment vocabulary;\n- factual `main` protection state documented as unprotected;\n- only Airtable snapshot + branding generation retain permanent generated-content write authority;\n- shared generated-main concurrency and collision-safe latest-main regeneration helper;\n- no force-push or workflow self-mutation allowed by governance tests;\n- **17** stale/no-op/merged branches removed through exact-head fail-closed audit;\n- snapshot automation moved `main` during the PR and the candidate still validated against the updated merge ref;\n- browser smoke was strengthened and exposed the real startup `syncNow(true)` search-focus regression;\n- silent startup/online sync now defers route rerender while the search field is focused, resuming on blur;\n- final hardened Chrome proof validates two-batch typing without refocus;\n- final **9/9** PR validation workflows + branding generator SUCCESS.\n\n**Status:** engineering/governance merged. `main` branch protection is not claimed enabled; Pages/Worker/installed-device VERIFIED PROD remain separate.\n\n'''
          r=section(r,r'^## Slice 16\.9 — Repository / deployment governance 🔵 CURRENT\n',r'^## Slice 16\.10 — Branding source cleanup\n',governance,'roadmap 16.9')
          r=r.replace('## Slice 16.10 — Branding source cleanup\n','## Slice 16.10 — Branding source cleanup 🔵 CURRENT\n',1)
          r=r.replace('deferred production/device proof from 16.2–16.6 plus Worker deployment proof affected by 16.8 and the final consolidated-runtime verification','deferred production/device proof from 16.2–16.6 plus Worker deployment proof affected by 16.8, installed-device search/sync proof affected by 16.9, and the final consolidated-runtime verification')
          p.write_text(r)
          PY
      - name: Validate checkpoint
        run: |
          grep -q 'a1689d14548c4ecbffe2e4b526d6db655f546ead' docs/PROJECT-STATE.md
          grep -q '16.9 repo/deployment governance:.*MERGED' docs/PROJECT-STATE.md
          grep -q '16.10 branding source cleanup:.*NEXT ACTIVE' docs/PROJECT-STATE.md
          test "$(grep -c '^### 16.9 — repo / deployment governance — MERGED / 9/9 GREEN$' docs/PROJECT-STATE.md)" -eq 1
          grep -q 'Current slice: .*Slice 16.10' docs/ROADMAP.md
          test "$(grep -c '^## Slice 16.9 — Repository / deployment governance ✅ MERGED / 9/9 GREEN$' docs/ROADMAP.md)" -eq 1
          test "$(grep -c '^## Slice 16.10 — Branding source cleanup 🔵 CURRENT$' docs/ROADMAP.md)" -eq 1
      - name: Commit docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT-STATE.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "Docs · Close Slice 16.9 and activate 16.10 [skip governance-docs]"
          git push origin HEAD:v0.5.16-state-after-governance
