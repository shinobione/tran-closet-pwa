name: Deploy Airtable write Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/worker-deploy.trigger'
      - 'worker/**'
      - 'shared/taxonomy.json'
      - 'scripts/generate-taxonomy.mjs'
      - 'scripts/test-taxonomy.mjs'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical taxonomy parity
        run: |
          node scripts/generate-taxonomy.mjs
          node scripts/test-taxonomy.mjs

      - name: Deploy Worker and Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            AIRTABLE_PAT
            AIRTABLE_READ_PAT
            CLOSET_SYNC_KEY
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT_WRITE }}
          AIRTABLE_READ_PAT: ${{ secrets.AIRTABLE_PAT }}
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}

      - name: Verify authenticated Worker health and canonical reads
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          BASE_URL="${WORKER_URL%/}"
          HEALTH_URL="$BASE_URL/health"
          ITEMS_URL="$BASE_URL/v1/items"
          OUTFITS_URL="$BASE_URL/v1/outfits"

          for attempt in $(seq 1 12); do
            STATUS="$(curl --silent --show-error --output /tmp/worker-health.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
              "$HEALTH_URL" || true)"
            if [ "$STATUS" = "200" ] && grep -q '"ok":true' /tmp/worker-health.json; then
              echo "Worker health verified at $HEALTH_URL on attempt $attempt"
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "Worker health verification failed after 12 attempts."
              cat /tmp/worker-health.json || true
              exit 1
            fi
            echo "Worker health not ready yet (HTTP $STATUS, attempt $attempt/12); retrying in 5s..."
            sleep 5
          done

          STATUS="$(curl --silent --show-error --output /tmp/worker-items.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            -H 'Cache-Control: no-cache' \
            "$ITEMS_URL" || true)"
          test "$STATUS" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/worker-items.json').read_text())
          assert body.get('ok') is True, body
          items=body.get('items')
          assert isinstance(items,list) and len(items)>=1, body
          assert body.get('recordCount')==len(items), body
          assert all(item.get('airtableRecordId') for item in items), body
          print(f"Canonical Worker clothing read verified: {len(items)} Airtable items")
          PY

          STATUS="$(curl --silent --show-error --output /tmp/worker-outfits.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            "$OUTFITS_URL" || true)"
          test "$STATUS" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/worker-outfits.json').read_text())
          assert body.get('ok') is True, body
          outfits=body.get('outfits')
          assert isinstance(outfits,list), body
          assert body.get('recordCount')==len(outfits), body
          assert all(outfit.get('airtableRecordId') and outfit.get('id') for outfit in outfits), body
          print(f"Canonical Worker Outfit read verified: {len(outfits)} Airtable outfits")
          PY
