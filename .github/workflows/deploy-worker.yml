name: Deploy Airtable write Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/worker-deploy.trigger'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Deploy Worker and Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            AIRTABLE_PAT
            CLOSET_SYNC_KEY
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT_WRITE }}
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}

      - name: Verify authenticated Worker health
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          HEALTH_URL="${WORKER_URL%/}/health"
          for attempt in $(seq 1 12); do
            STATUS="$(curl --silent --show-error --output /tmp/worker-health.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
              "$HEALTH_URL" || true)"
            if [ "$STATUS" = "200" ] && grep -q '"ok":true' /tmp/worker-health.json; then
              echo "Worker health verified at $HEALTH_URL on attempt $attempt"
              exit 0
            fi
            echo "Worker health not ready yet (HTTP $STATUS, attempt $attempt/12); retrying in 5s..."
            sleep 5
          done
          echo "Worker health verification failed after 12 attempts."
          cat /tmp/worker-health.json || true
          exit 1
