name: Deploy Airtable write Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/worker-deploy.trigger'
      - 'worker/**'
      - 'shared/taxonomy.json'
      - 'scripts/generate-taxonomy.mjs'
      - 'scripts/test-taxonomy.mjs'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical taxonomy parity
        run: |
          node scripts/generate-taxonomy.mjs
          node scripts/test-taxonomy.mjs

      - name: Deploy Worker and Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            AIRTABLE_PAT
            AIRTABLE_READ_PAT
            CLOSET_SYNC_KEY
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT_WRITE }}
          AIRTABLE_READ_PAT: ${{ secrets.AIRTABLE_PAT }}
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}

      - name: Verify authenticated Worker health, canonical reads and cache
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          BASE_URL="${WORKER_URL%/}"
          HEALTH_URL="$BASE_URL/health"
          ITEMS_URL="$BASE_URL/v1/items"
          OUTFITS_URL="$BASE_URL/v1/outfits"
          WEAR_URL="$BASE_URL/v1/wear-events"

          for attempt in $(seq 1 12); do
            STATUS="$(curl --silent --show-error --output /tmp/worker-health.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
              "$HEALTH_URL" || true)"
            if [ "$STATUS" = "200" ] && grep -q '"ok":true' /tmp/worker-health.json; then
              echo "Worker health verified at $HEALTH_URL on attempt $attempt"
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "Worker health verification failed after 12 attempts."
              cat /tmp/worker-health.json || true
              exit 1
            fi
            echo "Worker health not ready yet (HTTP $STATUS, attempt $attempt/12); retrying in 5s..."
            sleep 5
          done

          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/worker-health.json').read_text())
          assert body.get('ok') is True, body
          assert body.get('workerRevision')=='v061', body
          assert body.get('wearHistory')=='canonical-v1', body
          assert body.get('taxonomy')=='canonical-v1', body
          assert body.get('taxonomyCounts')=={'categories':17,'colors':24,'styles':6,'tags':22}, body
          assert body.get('apiCache')=='durable-object-v1', body
          assert body.get('apiCacheTtlHours')==12, body
          print('Canonical Worker identity verified: v061 / durable-object-v1 / wear canonical-v1 / taxonomy canonical-v1')
          PY

          STATUS="$(curl --silent --show-error --dump-header /tmp/items-headers-1.txt --output /tmp/worker-items.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            "$ITEMS_URL" || true)"
          test "$STATUS" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/worker-items.json').read_text())
          assert body.get('ok') is True, body
          items=body.get('items')
          assert isinstance(items,list) and len(items)>=1, body
          assert body.get('recordCount')==len(items), body
          assert all(item.get('airtableRecordId') for item in items), body
          print(f"Canonical Worker clothing read verified: {len(items)} items")
          PY

          STATUS="$(curl --silent --show-error --dump-header /tmp/items-headers-2.txt --output /tmp/worker-items-2.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            "$ITEMS_URL" || true)"
          test "$STATUS" = "200"
          grep -qi '^x-tran-cache: HIT' /tmp/items-headers-2.txt
          cmp /tmp/worker-items.json /tmp/worker-items-2.json
          echo 'Durable Object cache HIT verified on repeated clothing read.'

          STATUS="$(curl --silent --show-error --output /tmp/worker-outfits.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            "$OUTFITS_URL" || true)"
          test "$STATUS" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/worker-outfits.json').read_text())
          assert body.get('ok') is True, body
          outfits=body.get('outfits')
          assert isinstance(outfits,list), body
          assert body.get('recordCount')==len(outfits), body
          assert all(outfit.get('airtableRecordId') and outfit.get('id') for outfit in outfits), body
          print(f"Canonical Worker Outfit read verified: {len(outfits)} outfits")
          PY

          STATUS="$(curl --silent --show-error --output /tmp/worker-wear.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            "$WEAR_URL" || true)"
          test "$STATUS" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/worker-wear.json').read_text())
          assert body.get('ok') is True, body
          events=body.get('events')
          assert isinstance(events,list), body
          assert body.get('recordCount')==len(events), body
          assert all(event.get('airtableRecordId') and event.get('id') and event.get('wornDate') for event in events), body
          print(f"Canonical Worker wear-history read verified: {len(events)} events")
          PY
