name: Smoke Workers AI wardrobe analysis

# V0.4-A.1 diagnostic rerun: expose Worker AI error body before asserting HTTP 200
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-ai-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Analyze three canonical wardrobe photos
        env:
          WORKER_URL: https://tran-closet-sync.jerryquinet.workers.dev
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail

          analyze_one() {
            LABEL="$1"
            FILE="$2"
            python3 - "$FILE" <<'PY'
          import base64, json, sys
          from pathlib import Path
          image = Path(sys.argv[1]).read_bytes()
          payload = {'image': 'data:image/jpeg;base64,' + base64.b64encode(image).decode('ascii')}
          Path('/tmp/ai-payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

            STATUS="$(curl --silent --show-error --output /tmp/ai-result.json --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/ai-payload.json \
              "${WORKER_URL%/}/v1/analyze-item")"
            echo "=== $LABEL · HTTP $STATUS ==="
            if [ "$STATUS" != "200" ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('/tmp/ai-result.json').read_text(encoding='utf-8', errors='replace')
          try:
              body = json.loads(raw)
              print(json.dumps(body, ensure_ascii=False, indent=2))
          except Exception:
              print(raw[:2000])
          PY
              return 1
            fi

            python3 - "$LABEL" <<'PY'
          import json, sys
          from pathlib import Path
          label = sys.argv[1]
          body = json.loads(Path('/tmp/ai-result.json').read_text(encoding='utf-8'))
          assert body.get('ok') is True, body
          a = body.get('analysis') or {}
          categories = {'Shirt','Pant','Skirt','Dress','Combo','Coat','Bag','Shoes','Accessorie','Belt','Swimware','Eye Lens','Socks','Jumpsuit'}
          colors = {'Blue','Pink','Yellow','Black','Green','Purple','White','Grey','Orange','Red'}
          styles = {'Hip-Hop','Sport','Casual','Classy','Cartoon','Old'}
          assert isinstance(a.get('recognized'), bool), a
          if a['recognized']:
              assert a.get('category') in categories, a
          else:
              assert a.get('category') is None or a.get('category') in categories, a
          assert isinstance(a.get('colors'), list) and set(a['colors']) <= colors and len(a['colors']) <= 3, a
          assert isinstance(a.get('styles'), list) and set(a['styles']) <= styles and len(a['styles']) <= 2, a
          confidence = a.get('confidence')
          assert isinstance(confidence, (int, float)) and 0 <= confidence <= 1, a
          assert isinstance(a.get('reason'), str) and len(a['reason']) <= 180, a
          print(json.dumps({
              'item': label,
              'visionModel': body.get('visionModel'),
              'visionSummary': body.get('visionSummary'),
              'model': body.get('model'),
              'analysis': a
          }, ensure_ascii=False, indent=2))
          PY
          }

          analyze_one 'Neck Poca' 'assets/items/recLjpxC6kj5pGEEj.jpg'
          analyze_one 'Melody Bag' 'assets/items/recrtzfBVgQOYfAQN.jpg'
          analyze_one 'Tui Xach' 'assets/items/recZFFx4HaeVHOrTc.jpg'
