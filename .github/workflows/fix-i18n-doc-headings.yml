name: Fix i18n checkpoint headings

on:
  push:
    branches: [v0.5.16-state-after-i18n]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip doc-heading-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.16-state-after-i18n
          fetch-depth: 0
      - name: Remove duplicated headings
        run: |
          python <<'PY'
          from pathlib import Path
          fixes={
            'docs/PROJECT-STATE.md':[
              ('### 16.6 — PWA cache/version debt\n### 16.6 — PWA cache/version debt\n','### 16.6 — PWA cache/version debt\n'),
              ('## Verification vocabulary\n## Verification vocabulary\n','## Verification vocabulary\n'),
            ],
            'docs/ROADMAP.md':[
              ('## Slice 16.6 — Version / cache normalization 🔵 CURRENT\n## Slice 16.6 — Version / cache normalization\n','## Slice 16.6 — Version / cache normalization 🔵 CURRENT\n'),
            ],
          }
          for name,repls in fixes.items():
            p=Path(name); s=p.read_text()
            for old,new in repls:
              if s.count(old)!=1: raise SystemExit(f'{name}: expected one duplicate heading: {old!r}')
              s=s.replace(old,new)
            p.write_text(s)
          PY
      - name: Validate headings
        run: |
          test "$(grep -c '^### 16.6 — PWA cache/version debt$' docs/PROJECT-STATE.md)" -eq 1
          test "$(grep -c '^## Verification vocabulary$' docs/PROJECT-STATE.md)" -eq 1
          test "$(grep -c '^## Slice 16.6 — Version / cache normalization 🔵 CURRENT$' docs/ROADMAP.md)" -eq 1
          test "$(grep -c '^## Slice 16.6 — Version / cache normalization$' docs/ROADMAP.md)" -eq 0
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-i18n-doc-headings.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Docs · Fix 16.6 checkpoint headings [skip doc-heading-fix]"
          git push origin HEAD:v0.5.16-state-after-i18n
