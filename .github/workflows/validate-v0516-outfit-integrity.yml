name: Validate V0.5.16 Outfit integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-outfit-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check js/outfit-integrity.mjs
          node --check js/outfit-integrity-ui.js
          node --check js/wear-history-core.mjs
          node --check js/wear-history-i18n.mjs
          node --check js/wear-history.js
          node --check js/wear-sync-client.js
          node --check js/live-wear-sync-core.mjs
          node --check js/live-airtable-wear-sync.js
          node --check js/daily-assistant-core.mjs
          node --check js/i18n-keyed.mjs
          node --check js/bootstrap.js
          node --check js/db.js
          node --check js/manual-sync.js
          node --check js/sync-diagnostics.js
          node --check worker/src/v060.js
          node --check scripts/test-outfit-integrity.mjs
          node --check scripts/test-wear-history.mjs
          node --check scripts/test-wear-sync.mjs
          node --check sw.js

      - name: Test incomplete Outfit behavior
        run: node scripts/test-outfit-integrity.mjs

      - name: Test wear-event behavior
        run: node scripts/test-wear-history.mjs

      - name: Test wear-history live reconciliation
        run: node scripts/test-wear-sync.mjs

      - name: Check non-destructive integrity contract
        run: |
          grep -q "state:incomplete?'incomplete':'complete'" js/outfit-integrity.mjs
          grep -q "resolvedItems.length<OUTFIT_MIN_ITEMS" js/outfit-integrity.mjs
          if grep -Eq "deleteOutfit|putOutfit|queue.*Mutation|fetch\(" js/outfit-integrity.mjs js/outfit-integrity-ui.js; then
            echo 'Outfit integrity detection/UI must not mutate or delete canonical data.'
            exit 1
          fi

      - name: Check incomplete keyed UI and repair path
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          grep -q "t('outfit.incomplete.card')" js/outfit-integrity-ui.js
          grep -q "t('outfit.incomplete.title')" js/outfit-integrity-ui.js
          grep -q "'outfit.incomplete.title':'Outfit chưa hoàn chỉnh'" js/i18n-keyed.mjs
          grep -q "'outfit.incomplete.title':'Tenue incomplète'" js/i18n-keyed.mjs
          grep -q "outfit-integrity-incomplete" js/outfit-integrity-ui.js
          grep -q "outfit-presentation-actions" js/outfit-integrity-ui.js
          grep -q "outfit-integrity-ui.js?v=${RELEASE}" js/bootstrap.js

      - name: Check wear-history event model contract
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          grep -q "DB_VERSION=5" js/db.js
          grep -q "STORE_WEAR_EVENTS='wearEvents'" js/db.js
          grep -q "wear.createIndex('wornAt','wornAt')" js/db.js
          grep -q "wear.createIndex('outfitId','outfitId')" js/db.js
          grep -q "export const getAllWearEvents" js/db.js
          grep -q "export const putWearEvent" js/db.js
          grep -q "export const deleteWearEvent" js/db.js
          grep -q "WEAR_MIN_ITEMS=2" js/wear-history-core.mjs
          grep -q "wearEventId(outfitId,wornDate)" js/wear-history-core.mjs
          grep -q "eventForOutfitDate" js/wear-history-core.mjs
          grep -q "deriveWearStats" js/wear-history-core.mjs
          grep -q "data-wear-today" js/wear-history.js
          grep -q "data-wear-undo" js/wear-history.js
          grep -q "integrity.resolvedItemIds" js/wear-history.js
          grep -q "queueWearEventCreate" js/wear-history.js
          grep -q "queueWearEventDelete" js/wear-history.js
          grep -q "wear-history.js?v=${RELEASE}" js/bootstrap.js
          if grep -Eq "putOutfit\(|putItem\(" js/wear-history-core.mjs js/wear-history.js; then
            echo 'Wear history must not mutate clothing or Outfit canonical records.'
            exit 1
          fi

      - name: Check canonical wear-history sync contract
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          grep -q "QUEUE_KEY='wear-mutation-queue'" js/wear-sync-client.js
          grep -q "/v1/wear-mutations" js/wear-sync-client.js
          grep -q "item.airtableRecordId" js/wear-sync-client.js
          grep -q "itemRecordIds.length<2" worker/src/v060.js
          grep -q "WEAR_TABLE_ID='tblnkYdIz1dVZZhEF'" worker/src/v060.js
          grep -q "url.pathname==='/v1/wear-events'" worker/src/v060.js
          grep -q "url.pathname==='/v1/wear-mutations'" worker/src/v060.js
          grep -q "performUpsert:{fieldsToMergeOn:\[WEAR_FIELDS.eventId\]}" worker/src/v060.js
          grep -q "wearHistory:'canonical-v1'" worker/src/v060.js
          grep -q "workerRevision:'v060'" worker/src/v060.js
          grep -q 'main = "src/v060.js"' worker/wrangler.toml
          grep -q "syncLiveCanonicalWearEvents" js/bootstrap.js
          grep -q "startLiveWearSyncWatch" js/bootstrap.js
          grep -q "wear-sync-client.js?v=${RELEASE}" js/bootstrap.js
          grep -q "live-airtable-wear-sync.js?v=${RELEASE}" js/bootstrap.js
          grep -q "flushWearQueue" js/manual-sync.js
          grep -q "pendingWearMutations" js/sync-diagnostics.js
          grep -q "liveWear" js/sync-diagnostics.js

      - name: Check wear-history live anti-resurrection contract
        run: |
          grep -q "pendingDeleteEventIds" js/live-wear-sync-core.mjs
          grep -q "nextTombstones" js/live-wear-sync-core.mjs
          grep -q "deleteLocalIds" js/live-wear-sync-core.mjs
          grep -q "airtable-wear-delete-tombstones" js/live-airtable-wear-sync.js
          grep -q "tran:wear-history-live-changed" js/live-airtable-wear-sync.js
          grep -q "window.addEventListener('focus',check)" js/live-airtable-wear-sync.js
          grep -q "window.addEventListener('pageshow',check)" js/live-airtable-wear-sync.js
          if grep -q "location.reload()" js/live-airtable-wear-sync.js; then
            echo 'Wear-history convergence must not reload the browser.'
            exit 1
          fi

      - name: Check wear-history bilingual keyed copy
        run: |
          grep -q "'wear.action':'✓ Đã mặc hôm nay'" js/wear-history-i18n.mjs
          grep -q "'wear.action':'✓ Porté aujourd’hui'" js/wear-history-i18n.mjs
          grep -q "currentLanguage" js/wear-history-i18n.mjs

      - name: Check assistant excludes incomplete saved Outfits and has no B.2 ranking change
        run: |
          grep -q "const integrity=outfitIntegrity(outfit,items)" js/daily-assistant-core.mjs
          grep -q "if(integrity.incomplete)continue" js/daily-assistant-core.mjs
          if grep -Eq "wear-history|wear-sync|live-airtable-wear|deriveWearStats|lastWorn|rotationScore|rotationPenalty|rotationBoost" js/daily-assistant-core.mjs; then
            echo 'B.2 must not import wear history or change Daily Assistant rotation ranking.'
            exit 1
          fi

      - name: Check offline wiring and version
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          echo "$VERSION_VALUE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -q "outfit-integrity.mjs?v=${RELEASE}" sw.js
          grep -q "outfit-integrity-ui.js?v=${RELEASE}" sw.js
          grep -q "wear-history-core.mjs?v=${RELEASE}" sw.js
          grep -q "wear-history-i18n.mjs?v=${RELEASE}" sw.js
          grep -q "wear-history.js?v=${RELEASE}" sw.js
          grep -q "wear-sync-client.js?v=${RELEASE}" sw.js
          grep -q "live-wear-sync-core.mjs?v=${RELEASE}" sw.js
          grep -q "live-airtable-wear-sync.js?v=${RELEASE}" sw.js
          grep -q "i18n-keyed.mjs?v=${RELEASE}" sw.js

      - name: Check Worker deploy smoke includes wear history
        run: |
          grep -q 'WEAR_URL="$BASE_URL/v1/wear-events"' .github/workflows/deploy-worker.yml
          grep -q "worker-wear.json" .github/workflows/deploy-worker.yml
          grep -q "body.get('workerRevision')=='v060'" .github/workflows/deploy-worker.yml
          grep -q "body.get('wearHistory')=='canonical-v1'" .github/workflows/deploy-worker.yml
