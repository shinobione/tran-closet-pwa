name: PWA identity and cache isolation

on:
  pull_request:
    paths:
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/test-pwa-isolation.mjs'
      - '.github/workflows/pwa-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/test-pwa-isolation.mjs'
      - '.github/workflows/pwa-isolation.yml'

permissions:
  contents: read

jobs:
  pwa-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify unique PWA identity and cache namespace
        run: node scripts/test-pwa-isolation.mjs
