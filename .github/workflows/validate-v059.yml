name: Validate V0.5.9 UX i18n colors

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-v059:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/photo-picker.js
          node --check js/closet-search-core.mjs
          node --check js/closet-search.js
          node --check js/i18n-runtime-compat.js
          node --check worker/src/v059.js
          node --check js/bootstrap.js
          node --check sw.js
      - name: Check dual camera and gallery contract
        run: |
          grep -q "camera.id='cameraInput'" js/photo-picker.js
          grep -q "camera.setAttribute('capture','environment')" js/photo-picker.js
          grep -q "input.removeAttribute('capture')" js/photo-picker.js
          grep -q "data-photo-camera" js/photo-picker.js
          grep -q "data-photo-gallery" js/photo-picker.js
          grep -q "input.dataset.photo=photo" js/photo-picker.js
      - name: Check uninterrupted canonical search contract
        run: |
          grep -q "#searchInput" js/closet-search.js
          grep -q "card.hidden=!show" js/closet-search.js
          grep -q "FR_LABELS" js/closet-search-core.mjs
          ! grep -q "focus({preventScroll:true})" js/closet-search.js
      - name: Check expanded color taxonomy and French labels
        run: |
          grep -q "'Navy','Light Blue','Turquoise','Teal'" js/data.js
          grep -q "'Camel','Beige','Cream'" js/data.js
          grep -q "'Olive','Khaki','Mint'" js/data.js
          grep -q "'Burgundy','Gold','Silver'" js/data.js
          grep -q "Navy:'Bleu marine'" js/data.js
          grep -q "Cream:'Crème'" js/data.js
          grep -q "Burgundy:'Bordeaux'" js/data.js
          grep -q "Gold:'Doré'" js/data.js
          grep -q "Silver:'Argenté'" js/data.js
      - name: Check AI fine-color Worker contract
        run: |
          grep -q "main = \"src/v059.js\"" worker/wrangler.toml
          grep -q "detectFineColors" worker/src/v059.js
          grep -q "Use Navy for very dark blue" worker/src/v059.js
          grep -q "Distinguish Beige, Cream and White" worker/src/v059.js
          grep -q "colorTaxonomy='v0.5.9'" worker/src/v059.js
      - name: Check canonical runtime integration
        run: |
          test -f css/v059-ux.css
          grep -q "v059-ux.css?v=0.5.9" index.html
          grep -q "closet-search.js?v=0.5.16" js/bootstrap.js
          grep -q "photo-picker.js?v=0.5.16" js/bootstrap.js
          grep -q "i18n-runtime-compat.js?v=0.5.16" js/bootstrap.js
          grep -q "closet-search-core.mjs?v=0.5.16" sw.js
          grep -q "closet-search.js?v=0.5.16" sw.js
          grep -q "i18n-runtime-compat.js?v=0.5.16" sw.js
          grep -q "Ouvrir dans Tenues" js/i18n-runtime-compat.js
