name: Smoke V0.4-A.3 AI reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-ai-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Analyze canonical wardrobe photos with reliability contract
        env:
          WORKER_URL: https://tran-closet-sync.jerryquinet.workers.dev
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail

          analyze_one() {
            LABEL="$1"
            FILE="$2"
            python3 - "$FILE" <<'PY'
          import base64, json, sys
          from pathlib import Path
          image = Path(sys.argv[1]).read_bytes()
          payload = {'image': 'data:image/jpeg;base64,' + base64.b64encode(image).decode('ascii')}
          Path('/tmp/ai-payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

            STATUS="$(curl --silent --show-error --output /tmp/ai-result.json --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/ai-payload.json \
              "${WORKER_URL%/}/v1/analyze-item")"
            echo "=== $LABEL · HTTP $STATUS ==="
            if [ "$STATUS" != "200" ]; then
              cat /tmp/ai-result.json
              return 1
            fi

            python3 - "$LABEL" <<'PY'
          import json, sys
          from pathlib import Path
          label = sys.argv[1]
          body = json.loads(Path('/tmp/ai-result.json').read_text(encoding='utf-8'))
          assert body.get('ok') is True, body
          a = body.get('analysis') or {}
          categories = {'Shirt','Pant','Skirt','Dress','Combo','Coat','Bag','Shoes','Accessorie','Belt','Swimware','Eye Lens','Socks','Jumpsuit','Underwear','Headwear','Umbrella'}
          colors = {'Blue','Pink','Yellow','Black','Green','Purple','White','Grey','Orange','Red'}
          styles = {'Hip-Hop','Sport','Casual','Classy','Cartoon','Old'}
          assert isinstance(a.get('recognized'), bool), a
          if a['recognized']:
              assert a.get('category') in categories, a
          assert isinstance(a.get('colors'), list) and set(a['colors']) <= colors and len(a['colors']) <= 3, a
          assert isinstance(a.get('styles'), list) and set(a['styles']) <= styles and len(a['styles']) <= 2, a
          assert isinstance(a.get('confidence'), (int, float)) and 0 <= a['confidence'] <= 1, a
          assert body.get('reliability') in {'high','medium','low'}, body
          assert isinstance(body.get('retryUsed'), bool), body
          assert body.get('attempts') in {2,3}, body
          if body['retryUsed']:
              assert body['attempts'] == 3, body
          else:
              assert body['attempts'] == 2, body
          print(json.dumps({
              'item': label,
              'analysis': a,
              'reliability': body['reliability'],
              'retryUsed': body['retryUsed'],
              'attempts': body['attempts']
          }, ensure_ascii=False, indent=2))
          PY
          }

          analyze_one 'Neck Poca' 'assets/items/recLjpxC6kj5pGEEj.jpg'
          analyze_one 'Melody Bag' 'assets/items/recrtzfBVgQOYfAQN.jpg'
          analyze_one 'Tui Xach' 'assets/items/recZFFx4HaeVHOrTc.jpg'
