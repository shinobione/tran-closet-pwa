name: Diagnose V0.4-A.3 Melody vision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-ai-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Inspect Melody Bag vision passes
        env:
          WORKER_URL: https://tran-closet-sync.jerryquinet.workers.dev
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          image = Path('assets/items/recrtzfBVgQOYfAQN.jpg').read_bytes()
          payload = {'image': 'data:image/jpeg;base64,' + base64.b64encode(image).decode('ascii')}
          Path('/tmp/ai-payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          STATUS="$(curl --silent --show-error --output /tmp/ai-result.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ai-payload.json \
            "${WORKER_URL%/}/v1/analyze-item")"
          test "$STATUS" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/ai-result.json').read_text(encoding='utf-8'))
          print(json.dumps({
            'analysis': body.get('analysis'),
            'reliability': body.get('reliability'),
            'retryUsed': body.get('retryUsed'),
            'attempts': body.get('attempts'),
            'visionSummary': body.get('visionSummary')
          }, ensure_ascii=False, indent=2))
          PY
