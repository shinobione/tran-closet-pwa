name: Diagnose V0.4-A.3 Moondream request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-ai-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Print exact Worker response for Neck Poca
        env:
          WORKER_URL: https://tran-closet-sync.jerryquinet.workers.dev
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          image=Path('assets/items/recLjpxC6kj5pGEEj.jpg').read_bytes()
          Path('/tmp/ai-payload.json').write_text(json.dumps({'image':'data:image/jpeg;base64,'+base64.b64encode(image).decode('ascii')}),encoding='utf-8')
          PY
          STATUS="$(curl --silent --show-error --output /tmp/ai-result.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ai-payload.json \
            "${WORKER_URL%/}/v1/analyze-item")"
          echo "=== HTTP $STATUS ==="
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/ai-result.json').read_text(encoding='utf-8',errors='replace')
          try:
              print(json.dumps(json.loads(raw),ensure_ascii=False,indent=2))
          except Exception:
              print(raw[:4000])
          PY
          test "$STATUS" = "200"
