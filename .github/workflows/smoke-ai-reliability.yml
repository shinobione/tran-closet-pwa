name: Smoke restored V0.4-A.3 reliability backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-ai-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Verify three canonical analyses return reliability contract
        env:
          WORKER_URL: https://tran-closet-sync.jerryquinet.workers.dev
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          analyze_one() {
            LABEL="$1"
            FILE="$2"
            python3 - "$FILE" <<'PY'
          import base64,json,sys
          from pathlib import Path
          image=Path(sys.argv[1]).read_bytes()
          Path('/tmp/ai-payload.json').write_text(json.dumps({'image':'data:image/jpeg;base64,'+base64.b64encode(image).decode('ascii')}),encoding='utf-8')
          PY
            STATUS="$(curl --silent --show-error --output /tmp/ai-result.json --write-out '%{http_code}' \
              -X POST -H "Authorization: Bearer $CLOSET_SYNC_KEY" -H 'Content-Type: application/json' \
              --data-binary @/tmp/ai-payload.json "${WORKER_URL%/}/v1/analyze-item")"
            echo "=== $LABEL · HTTP $STATUS ==="
            test "$STATUS" = "200"
            python3 - "$LABEL" <<'PY'
          import json,sys
          from pathlib import Path
          label=sys.argv[1]
          body=json.loads(Path('/tmp/ai-result.json').read_text(encoding='utf-8'))
          assert body.get('ok') is True, body
          a=body.get('analysis') or {}
          assert isinstance(a.get('recognized'),bool),a
          assert isinstance(a.get('confidence'),(int,float)) and 0 <= a['confidence'] <= 1,a
          assert body.get('reliability') in {'high','medium','low'},body
          assert isinstance(body.get('retryUsed'),bool),body
          assert body.get('attempts') in {2,3},body
          print(json.dumps({'item':label,'analysis':a,'reliability':body.get('reliability'),'retryUsed':body.get('retryUsed'),'attempts':body.get('attempts')},ensure_ascii=False,indent=2))
          PY
          }
          analyze_one 'Neck Poca' 'assets/items/recLjpxC6kj5pGEEj.jpg'
          analyze_one 'Melody Bag' 'assets/items/recrtzfBVgQOYfAQN.jpg'
          analyze_one 'Tui Xach' 'assets/items/recZFFx4HaeVHOrTc.jpg'
