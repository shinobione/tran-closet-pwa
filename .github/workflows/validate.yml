name: Validate PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/data.js
          node --check js/db.js
          node --check js/bootstrap.js
          node --check js/airtable-bridge.js
          node --check js/airtable-snapshot.js
          node --check js/airtable-outfit-bridge.js
          node --check js/airtable-outfit-snapshot.js
          node --check js/sync-client.js
          node --check js/outfit-sync-client.js
          node --check js/sync-diagnostics.js
          node --check js/outfit-picker.js
          node --check js/outfit-presentation.js
          node --check js/item-ai-assistant.js
          node --check js/duplicate-core.mjs
          node --check js/duplicate-guard.js
          node --check scripts/sync-airtable.mjs
          node --check scripts/sync-outfits.mjs
          node --check scripts/test-duplicate-core.mjs
          node --check scripts/test-smart-tags.mjs
          node --check worker/src/index.js
          node --check sw.js
      - name: Run focused unit tests
        run: |
          node scripts/test-duplicate-core.mjs
          node scripts/test-smart-tags.mjs
      - name: Check JSON and manifest
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool worker/package.json > /dev/null
      - name: Check PWA and sync shell files
        run: |
          test -f index.html
          test -f css/app.css
          test -f css/outfits.css
          test -f css/outfit-picker.css
          test -f css/outfit-presentation.css
          test -f css/item-ai-assistant.css
          test -f css/duplicate-guard.css
          test -f js/bootstrap.js
          test -f js/airtable-bridge.js
          test -f js/airtable-snapshot.js
          test -f js/airtable-outfit-bridge.js
          test -f js/airtable-outfit-snapshot.js
          test -f js/sync-client.js
          test -f js/outfit-sync-client.js
          test -f js/sync-diagnostics.js
          test -f js/outfit-picker.js
          test -f js/outfit-presentation.js
          test -f js/item-ai-assistant.js
          test -f js/duplicate-core.mjs
          test -f js/duplicate-guard.js
          test -f scripts/test-duplicate-core.mjs
          test -f scripts/test-smart-tags.mjs
          test -f scripts/sync-airtable.mjs
          test -f scripts/sync-outfits.mjs
          test -f worker/src/index.js
          test -f worker/wrangler.toml
          grep -q 'bootstrap.js?v=0.4.6' index.html
          grep -q 'item-ai-assistant.css?v=0.4.6' index.html
          grep -q 'duplicate-guard.css?v=0.4.6' index.html
          grep -q 'app.js?v=0.4.6' js/bootstrap.js
          grep -q 'outfit-picker.js?v=0.4.6' js/bootstrap.js
          grep -q 'item-ai-assistant.js?v=0.4.6' js/bootstrap.js
          grep -q 'duplicate-guard.js?v=0.4.6' js/bootstrap.js
          grep -q 'sync-diagnostics.js?v=0.4.6' js/bootstrap.js
          grep -q 'serviceWorker' js/app.js
          grep -q 'queueMutation' js/app.js
          grep -q "STORE_OUTFITS='outfits'" js/db.js
          grep -q "STORE_OUTFIT_MUTATIONS='outfitMutations'" js/db.js
          grep -q 'DB_VERSION=4' js/db.js
          grep -q 'tblhtL2UlsgCAh6E7' scripts/sync-outfits.mjs
          grep -q '/v1/outfit-mutations' worker/src/index.js
          grep -q '/v1/analyze-item' worker/src/index.js
          grep -q '@cf/meta/llama-4-scout-17b-16e-instruct' worker/src/index.js
          grep -q '@cf/llava-hf/llava-1.5-7b-hf' worker/src/index.js
          grep -q 'guided_json' worker/src/index.js
          grep -q "Underwear" js/data.js
          grep -q "Headwear" js/data.js
          grep -q "Umbrella" js/data.js
          grep -q "Brown:'Nâu'" js/data.js
          grep -q 'MAX_CLIENT_ATTEMPTS=3' js/item-ai-assistant.js
          grep -q 'duplicateGuardMounted' js/duplicate-guard.js
          grep -q 'MAX_VISUAL_CANDIDATES=80' js/duplicate-guard.js
          grep -q 'Vẫn lưu món này' js/duplicate-guard.js
          grep -q 'duplicate-core.mjs?v=0.4.6' js/duplicate-guard.js
          grep -q 'hammingDistance' js/duplicate-core.mjs
          grep -q 'duplicateAssessment' js/duplicate-core.mjs
          grep -q 'tran-closet-v0.4.6' sw.js
          grep -q 'duplicate-core.mjs?v=0.4.6' sw.js
          grep -q "const VERSION='v0.4.6'" js/sync-diagnostics.js
          grep -q 'navigator.share' js/outfit-presentation.js
          grep -q '1080' js/outfit-presentation.js
          grep -q '1350' js/outfit-presentation.js
      - name: Check V0.4-C Smart Tags contract
        run: |
          grep -q "tags: \['Minimal','Statement'" js/data.js
          grep -q "Minimal:'Tối giản'" js/data.js
          grep -q "'Travel-friendly':'Du lịch'" js/data.js
          grep -q 'name="tags"' js/app.js
          grep -q "tags:f.getAll('tags')" js/app.js
          grep -q "label('tag',v)" js/app.js
          grep -q 'version:4' js/app.js
          grep -q 'item.tags||\[\]' js/sync-client.js
          grep -q "tags: 'fld9hV9qirpfVfJmM'" scripts/sync-airtable.mjs
          grep -q 'tags: cleanMulti' scripts/sync-airtable.mjs
          grep -q "tags:'fld9hV9qirpfVfJmM'" worker/src/index.js
          grep -q 'enum:TAXONOMY.tags' worker/src/index.js
          grep -q 'maxItems:5' worker/src/index.js
          grep -q 'tagReason' worker/src/index.js
          grep -q 'Allowed tag values' worker/src/index.js
          grep -q 'if(Array.isArray(payload.tags))fields\[FIELDS.tags\]=payload.tags' worker/src/index.js
          grep -q 'analysis.tags' js/item-ai-assistant.js
          grep -q "TAXONOMY.tags.includes" js/item-ai-assistant.js
          grep -q 'name="tags"' js/item-ai-assistant.js
          grep -q 'ai-tag-reason' css/item-ai-assistant.css
          grep -q 'item.tags||\[\]' js/outfit-picker.js
          grep -q "translated('tag',v)" js/outfit-picker.js
          grep -q 'taggedItemCount' js/sync-diagnostics.js
      - name: Guard against committed secrets
        run: |
          if grep -R --exclude='sync-airtable.yml' --exclude='deploy-worker.yml' --exclude='index.js' --exclude-dir='.git' -E 'pat[A-Za-z0-9._-]{20,}' .; then
            echo 'Potential Airtable PAT found in committed files.'
            exit 1
          fi
          if grep -R --exclude='deploy-worker.yml' --exclude-dir='.git' -E 'CLOSET_SYNC_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,}' .; then
            echo 'Potential hard-coded closet sync key found.'
            exit 1
          fi
