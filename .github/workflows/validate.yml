name: Validate PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/data.js
          node --check js/taxonomy.generated.mjs
          node --check js/db.js
          node --check js/bootstrap.js
          node --check js/airtable-bridge.js
          node --check js/airtable-snapshot.js
          node --check js/airtable-outfit-bridge.js
          node --check js/airtable-outfit-snapshot.js
          node --check js/sync-client.js
          node --check js/outfit-sync-client.js
          node --check js/sync-diagnostics.js
          node --check js/outfit-picker.js
          node --check js/outfit-presentation.js
          node --check js/outfit-integrity.mjs
          node --check js/outfit-integrity-ui.js
          node --check js/wear-history-core.mjs
          node --check js/wear-history-i18n.mjs
          node --check js/wear-history.js
          node --check js/item-ai-assistant.js
          node --check js/duplicate-core.mjs
          node --check js/duplicate-guard.js
          node --check js/daily-assistant-core.mjs
          node --check js/daily-assistant.js
          node --check js/i18n.js
          node --check js/i18n-keyed.mjs
          node --check scripts/sync-airtable.mjs
          node --check scripts/sync-outfits.mjs
          node --check scripts/test-duplicate-core.mjs
          node --check scripts/test-smart-tags.mjs
          node --check scripts/test-daily-assistant.mjs
          node --check scripts/test-keyed-i18n.mjs
          node --check scripts/test-wear-history.mjs
          node --check scripts/generate-taxonomy.mjs
          node --check scripts/test-taxonomy.mjs
          node --check scripts/normalize-release-refs.mjs
          node --check scripts/test-version-cache.mjs
          node --check scripts/test-pwa-isolation.mjs
          node --check worker/src/taxonomy.generated.mjs
          node --check worker/src/index.js
          node --check sw.js
      - name: Run focused unit tests
        run: |
          node scripts/test-duplicate-core.mjs
          node scripts/test-smart-tags.mjs
          node scripts/test-daily-assistant.mjs
          node scripts/test-keyed-i18n.mjs
          node scripts/test-wear-history.mjs
          node scripts/generate-taxonomy.mjs
          node scripts/test-taxonomy.mjs
          node scripts/normalize-release-refs.mjs
          node scripts/test-version-cache.mjs
          node scripts/test-pwa-isolation.mjs
      - name: Check JSON and manifest
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool shared/taxonomy.json > /dev/null
          python -m json.tool worker/package.json > /dev/null
      - name: Check PWA and sync shell files
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          test -f index.html
          test -f css/app.css
          test -f css/outfits.css
          test -f css/outfit-picker.css
          test -f css/outfit-presentation.css
          test -f css/item-ai-assistant.css
          test -f css/duplicate-guard.css
          test -f css/daily-assistant.css
          test -f css/i18n.css
          test -f js/bootstrap.js
          test -f js/airtable-bridge.js
          test -f js/airtable-snapshot.js
          test -f js/airtable-outfit-bridge.js
          test -f js/airtable-outfit-snapshot.js
          test -f js/sync-client.js
          test -f js/outfit-sync-client.js
          test -f js/sync-diagnostics.js
          test -f js/outfit-picker.js
          test -f js/outfit-presentation.js
          test -f js/outfit-integrity.mjs
          test -f js/outfit-integrity-ui.js
          test -f js/wear-history-core.mjs
          test -f js/wear-history-i18n.mjs
          test -f js/wear-history.js
          test -f js/item-ai-assistant.js
          test -f js/duplicate-core.mjs
          test -f js/duplicate-guard.js
          test -f js/daily-assistant-core.mjs
          test -f js/daily-assistant.js
          test -f js/i18n.js
          test -f js/i18n-keyed.mjs
          test -f js/taxonomy.generated.mjs
          test -f worker/src/taxonomy.generated.mjs
          test -f shared/taxonomy.json
          test ! -e js/i18n-runtime-compat.js
          test -f scripts/test-duplicate-core.mjs
          test -f scripts/test-smart-tags.mjs
          test -f scripts/test-daily-assistant.mjs
          test -f scripts/test-keyed-i18n.mjs
          test -f scripts/test-wear-history.mjs
          test -f scripts/generate-taxonomy.mjs
          test -f scripts/test-taxonomy.mjs
          test -f scripts/normalize-release-refs.mjs
          test -f scripts/test-version-cache.mjs
          test -f scripts/test-pwa-isolation.mjs
          test -f scripts/sync-airtable.mjs
          test -f scripts/sync-outfits.mjs
          test -f worker/src/index.js
          test -f worker/wrangler.toml
          grep -Fq "bootstrap.js?v=${RELEASE}" index.html
          grep -Fq "item-ai-assistant.css?v=${RELEASE}" index.html
          grep -Fq "duplicate-guard.css?v=${RELEASE}" index.html
          grep -Fq "daily-assistant.css?v=${RELEASE}" index.html
          grep -Fq "i18n.css?v=${RELEASE}" index.html
          grep -Fq "app.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "outfit-picker.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "wear-history.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "item-ai-assistant.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "duplicate-guard.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "daily-assistant.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "sync-diagnostics.js?v=${RELEASE}" js/bootstrap.js
          grep -Fq "i18n.js?v=${RELEASE}" js/bootstrap.js
          ! grep -q 'i18n-runtime-compat.js' js/bootstrap.js
          grep -q 'serviceWorker' js/app.js
          grep -Fq "updateViaCache:'none'" js/app.js
          grep -q 'queueMutation' js/app.js
          grep -q "STORE_OUTFITS='outfits'" js/db.js
          grep -q "STORE_OUTFIT_MUTATIONS='outfitMutations'" js/db.js
          grep -q "STORE_WEAR_EVENTS='wearEvents'" js/db.js
          grep -q 'DB_VERSION=5' js/db.js
          grep -q 'tblhtL2UlsgCAh6E7' scripts/sync-outfits.mjs
          grep -q '/v1/outfit-mutations' worker/src/index.js
          grep -q '/v1/analyze-item' worker/src/index.js
          grep -q '@cf/meta/llama-4-scout-17b-16e-instruct' worker/src/index.js
          grep -q '@cf/llava-hf/llava-1.5-7b-hf' worker/src/index.js
          grep -q 'guided_json' worker/src/index.js
          grep -q "taxonomy.generated.mjs?v=${RELEASE}" js/data.js
          grep -q "./js/taxonomy.generated.mjs?v=${RELEASE}" sw.js
          grep -Fq "wear-history-core.mjs?v=${RELEASE}" sw.js
          grep -Fq "wear-history-i18n.mjs?v=${RELEASE}" sw.js
          grep -Fq "wear-history.js?v=${RELEASE}" sw.js
          grep -q "from './taxonomy.generated.mjs'" worker/src/index.js
          grep -q "from './taxonomy.generated.mjs'" worker/src/v059.js
          grep -q 'MAX_CLIENT_ATTEMPTS=3' js/item-ai-assistant.js
          grep -q 'duplicateGuardMounted' js/duplicate-guard.js
          grep -q 'MAX_VISUAL_CANDIDATES=80' js/duplicate-guard.js
          grep -Fq "i18n-keyed.mjs?v=${RELEASE}" js/duplicate-guard.js
          grep -q "t('duplicate.continue')" js/duplicate-guard.js
          grep -q 'duplicate.reason.nearlyIdentical' js/duplicate-core.mjs
          ! grep -q 'Vẫn lưu món này' js/duplicate-guard.js
          grep -q 'hammingDistance' js/duplicate-core.mjs
          grep -q 'duplicateAssessment' js/duplicate-core.mjs
          grep -Fq "i18n-keyed.mjs?v=${RELEASE}" js/item-ai-assistant.js
          grep -q 'language:currentLanguage()' js/item-ai-assistant.js
          ! grep -q 'TRỢ LÝ ẢNH' js/item-ai-assistant.js
          ! grep -q 'Áp dụng gợi ý' js/item-ai-assistant.js
          grep -q "outputLanguage=language==='fr'?'French':'Vietnamese'" worker/src/index.js
          grep -Fq '${outputLanguage}' worker/src/index.js
          grep -q "const CACHE_PREFIX='tran-closet-'" sw.js
          grep -q 'shortSha' sw.js
          ! grep -q "const CACHE = 'tran-closet-v0.5.1'" sw.js
          grep -Fq "app.js?v=${RELEASE}" sw.js
          grep -Fq "outfit-picker.js?v=${RELEASE}" sw.js
          grep -Fq "daily-assistant-core.mjs?v=${RELEASE}" sw.js
          grep -Fq "daily-assistant.js?v=${RELEASE}" sw.js
          grep -Fq "i18n-keyed.mjs?v=${RELEASE}" sw.js
          grep -Fq "i18n.js?v=${RELEASE}" sw.js
          ! grep -q 'i18n-runtime-compat.js' sw.js
          grep -Fq "const FALLBACK_VERSION='${VERSION_VALUE}';" js/sync-diagnostics.js
          grep -q 'navigator.share' js/outfit-presentation.js
          grep -q '1080' js/outfit-presentation.js
          grep -q '1350' js/outfit-presentation.js
      - name: Check V0.4-C Smart Tags contract
        run: |
          node scripts/test-taxonomy.mjs
          grep -q 'name="tags"' js/app.js
          grep -q "tags:f.getAll('tags')" js/app.js
          grep -q "label('tag',v)" js/app.js
          grep -q 'version:4' js/app.js
          grep -q 'item.tags||\[\]' js/sync-client.js
          grep -q "tags: 'fld9hV9qirpfVfJmM'" scripts/sync-airtable.mjs
          grep -q 'tags: cleanMulti' scripts/sync-airtable.mjs
          grep -q "tags:'fld9hV9qirpfVfJmM'" worker/src/index.js
          grep -q 'enum:TAXONOMY.tags' worker/src/index.js
          grep -q 'maxItems:5' worker/src/index.js
          grep -q 'tagReason' worker/src/index.js
          grep -q 'Allowed tag values' worker/src/index.js
          grep -q 'if(Array.isArray(payload.tags))fields\[FIELDS.tags\]=payload.tags' worker/src/index.js
          grep -q 'analysis.tags' js/item-ai-assistant.js
          grep -q "TAXONOMY.tags.includes" js/item-ai-assistant.js
          grep -q 'name="tags"' js/item-ai-assistant.js
          grep -q 'ai-tag-reason' css/item-ai-assistant.css
          grep -q 'item.tags||\[\]' js/outfit-picker.js
          grep -q "translated('tag',v)" js/outfit-picker.js
          grep -q 'taggedItemCount' js/sync-diagnostics.js
      - name: Check V0.5-A Daily Assistant contract
        run: |
          grep -q "'daily.header.title':'Hôm nay mặc gì?'" js/i18n-keyed.mjs
          grep -q "'daily.header.title':'Que porter aujourd’hui ?'" js/i18n-keyed.mjs
          grep -q 'api.open-meteo.com/v1/forecast' js/daily-assistant.js
          grep -q 'geocoding-api.open-meteo.com/v1/search' js/daily-assistant.js
          grep -q "DEFAULT_LOCATION={name:'TP. Hồ Chí Minh'" js/daily-assistant.js
          grep -q 'navigator.geolocation.getCurrentPosition' js/daily-assistant.js
          grep -q '30\*60\*1000' js/daily-assistant.js
          grep -q "putOutfit" js/daily-assistant.js
          grep -q 'tran:outfit-sync-needed' js/daily-assistant.js
          grep -q 'itemIds.length<2' js/daily-assistant.js
          grep -q 'weatherProfile' js/daily-assistant-core.mjs
          grep -q 'recommendLooks' js/daily-assistant-core.mjs
          grep -q "Underwear" js/daily-assistant-core.mjs
          grep -q "Rain-ready" js/daily-assistant-core.mjs
          grep -q 'sameItemSet' js/daily-assistant-core.mjs
          grep -q "daily.reason.rainReady" js/daily-assistant-core.mjs
          grep -q 'Daily Assistant subsets canonical' scripts/test-taxonomy.mjs
          grep -q 'daily assistant core: PASS' scripts/test-daily-assistant.mjs
      - name: Check bilingual keyed foundation and legacy boundary
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          RELEASE="${VERSION_VALUE#v}"
          grep -q "LANGUAGE_KEY='tran-closet-language'" js/i18n.js
          grep -q "SUPPORTED=new Set(\['vi','fr'\])" js/i18n.js
          grep -q "searchParams.get('lang')" js/i18n.js
          grep -q "localStorage.setItem(LANGUAGE_KEY" js/i18n.js
          grep -q "window.confirm=message=>nativeConfirm(translateRaw(message))" js/i18n.js
          grep -q "apply:scope=>" js/i18n.js
          ! grep -q "observer.observe(document.body,{subtree:true" js/i18n.js
          grep -q "TranClosetI18n?.apply" js/app.js
          grep -q "export function t(key" js/i18n-keyed.mjs
          grep -q "SUPPORTED_LANGUAGES=new Set(\['vi','fr'\])" js/i18n-keyed.mjs
          grep -q "'photo.take':'Prendre une photo'" js/i18n-keyed.mjs
          grep -q "'diagnostics.title':'Diagnostic de synchronisation'" js/i18n-keyed.mjs
          grep -q "'app.edit.eyebrow':'MODIFIER'" js/i18n-keyed.mjs
          grep -q "'outfit.picker.reset':'Réinitialiser'" js/i18n-keyed.mjs
          grep -q "'duplicate.continue':'Enregistrer quand même'" js/i18n-keyed.mjs
          grep -q "'ai.card.eyebrow':'ASSISTANT PHOTO'" js/i18n-keyed.mjs
          grep -Fq "i18n-keyed.mjs?v=${RELEASE}" js/app.js
          grep -Fq "i18n-keyed.mjs?v=${RELEASE}" js/outfit-picker.js
          test ! -e js/i18n-runtime-compat.js
          grep -q 'language-switch' css/i18n.css
      - name: Guard against committed secrets
        run: |
          if grep -R --exclude='sync-airtable.yml' --exclude='deploy-worker.yml' --exclude='index.js' --exclude-dir='.git' -E 'pat[A-Za-z0-9._-]{20,}' .; then
            echo 'Potential Airtable PAT found in committed files.'
            exit 1
          fi
          if grep -R --exclude='deploy-worker.yml' --exclude-dir='.git' -E 'CLOSET_SYNC_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,}' .; then
            echo 'Potential hard-coded closet sync key found.'
            exit 1
          fi
