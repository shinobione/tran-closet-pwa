name: Validate PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/data.js
          node --check js/db.js
          node --check js/bootstrap.js
          node --check js/airtable-bridge.js
          node --check js/airtable-snapshot.js
          node --check js/airtable-outfit-bridge.js
          node --check js/airtable-outfit-snapshot.js
          node --check js/sync-client.js
          node --check js/outfit-sync-client.js
          node --check js/sync-diagnostics.js
          node --check js/outfit-picker.js
          node --check js/outfit-presentation.js
          node --check js/item-ai-assistant.js
          node --check scripts/sync-airtable.mjs
          node --check scripts/sync-outfits.mjs
          node --check worker/src/index.js
          node --check sw.js
      - name: Check JSON and manifest
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool worker/package.json > /dev/null
      - name: Check PWA and sync shell files
        run: |
          test -f index.html
          test -f css/app.css
          test -f css/outfits.css
          test -f css/outfit-picker.css
          test -f css/outfit-presentation.css
          test -f css/item-ai-assistant.css
          test -f js/bootstrap.js
          test -f js/airtable-bridge.js
          test -f js/airtable-snapshot.js
          test -f js/airtable-outfit-bridge.js
          test -f js/airtable-outfit-snapshot.js
          test -f js/sync-client.js
          test -f js/outfit-sync-client.js
          test -f js/sync-diagnostics.js
          test -f js/outfit-picker.js
          test -f js/outfit-presentation.js
          test -f js/item-ai-assistant.js
          test -f scripts/sync-airtable.mjs
          test -f scripts/sync-outfits.mjs
          test -f worker/src/index.js
          test -f worker/wrangler.toml
          test -f .github/workflows/deploy-worker.yml
          test -f icons/apple-touch-icon.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          grep -q 'manifest.webmanifest' index.html
          grep -q 'bootstrap.js?v=0.4.3' index.html
          grep -q 'outfits.css?v=0.4.3' index.html
          grep -q 'outfit-picker.css?v=0.4.3' index.html
          grep -q 'outfit-presentation.css?v=0.4.3' index.html
          grep -q 'item-ai-assistant.css?v=0.4.3' index.html
          grep -q 'outfit-picker.js?v=0.4.3' js/bootstrap.js
          grep -q 'outfit-sync-client.js?v=0.4.3' js/bootstrap.js
          grep -q 'outfit-presentation.js?v=0.4.3' js/bootstrap.js
          grep -q 'item-ai-assistant.js?v=0.4.3' js/bootstrap.js
          grep -q 'sync-diagnostics.js?v=0.4.3' js/bootstrap.js
          grep -q 'syncOutfitSnapshotToLocalDB' js/bootstrap.js
          grep -q 'serviceWorker' js/app.js
          grep -q 'queueMutation' js/app.js
          grep -q 'getAllOutfits' js/app.js
          grep -q "STORE_OUTFITS='outfits'" js/db.js
          grep -q "STORE_OUTFIT_MUTATIONS='outfitMutations'" js/db.js
          grep -q 'DB_VERSION=4' js/db.js
          grep -q 'tblhtL2UlsgCAh6E7' scripts/sync-outfits.mjs
          grep -q '/v1/outfit-mutations' worker/src/index.js
          grep -q 'fld0mNaoxnTIckVXI' worker/src/index.js
          grep -q '/v1/analyze-item' worker/src/index.js
          grep -q '@cf/meta/llama-4-scout-17b-16e-instruct' worker/src/index.js
          grep -q '@cf/llava-hf/llava-1.5-7b-hf' worker/src/index.js
          grep -q 'guided_json' worker/src/index.js
          grep -q "Underwear" js/data.js
          grep -q "Headwear" js/data.js
          grep -q "Umbrella" js/data.js
          grep -q "Underwear" worker/src/index.js
          grep -q "Headwear" worker/src/index.js
          grep -q "Umbrella" worker/src/index.js
          grep -q "Promise.all" worker/src/index.js
          grep -q "crosscheck" worker/src/index.js
          grep -q "rescue" worker/src/index.js
          grep -q 'retryUsed' worker/src/index.js
          grep -q 'reliability' worker/src/index.js
          grep -q 'MAX_CLIENT_ATTEMPTS=3' js/item-ai-assistant.js
          grep -q 'shouldClientRetry' js/item-ai-assistant.js
          grep -q 'clientAttempts' js/item-ai-assistant.js
          grep -q 'totalVisionPasses' js/item-ai-assistant.js
          grep -q 'Đang tự thử lại' js/item-ai-assistant.js
          grep -q 'aiAssistantMounted' js/item-ai-assistant.js
          grep -q 'ai-photo-preview' js/item-ai-assistant.js
          grep -q 'object-fit:contain' css/item-ai-assistant.css
          grep -q 'Tin cậy cao' js/item-ai-assistant.js
          grep -q '^\[ai\]' worker/wrangler.toml
          grep -q 'binding = "AI"' worker/wrangler.toml
          grep -q 'tran-closet-v0.4.3' sw.js
          grep -q 'item-ai-assistant.css?v=0.4.3' sw.js
          grep -q 'item-ai-assistant.js?v=0.4.3' sw.js
          grep -q "const VERSION='v0.4.3'" js/sync-diagnostics.js
          grep -q 'navigator.share' js/outfit-presentation.js
          grep -q 'navigator.canShare' js/outfit-presentation.js
          grep -q '1080' js/outfit-presentation.js
          grep -q '1350' js/outfit-presentation.js
          grep -q 'Áp dụng gợi ý' js/item-ai-assistant.js
          grep -q 'TAXONOMY.categories.includes' js/item-ai-assistant.js
          grep -q 'CLOSET_SYNC_KEY' worker/src/index.js
          grep -q 'AIRTABLE_PAT' worker/src/index.js
          grep -q 'AIRTABLE_PAT' .github/workflows/sync-airtable.yml
          grep -q 'sync-outfits.mjs' .github/workflows/sync-airtable.yml
          grep -q 'CLOUDFLARE_API_TOKEN' .github/workflows/deploy-worker.yml
          grep -q 'CLOUDFLARE_ACCOUNT_ID' .github/workflows/deploy-worker.yml
          grep -q 'AIRTABLE_PAT_WRITE' .github/workflows/deploy-worker.yml
          grep -q 'CLOSET_SYNC_KEY' .github/workflows/deploy-worker.yml
      - name: Guard against committed secrets
        run: |
          if grep -R --exclude='sync-airtable.yml' --exclude='deploy-worker.yml' --exclude='index.js' --exclude-dir='.git' -E 'pat[A-Za-z0-9._-]{20,}' .; then
            echo 'Potential Airtable PAT found in committed files.'
            exit 1
          fi
          if grep -R --exclude='deploy-worker.yml' --exclude-dir='.git' -E 'CLOSET_SYNC_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,}' .; then
            echo 'Potential hard-coded closet sync key found.'
            exit 1
          fi
