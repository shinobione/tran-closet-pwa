name: Cleanup audited merged branches

on:
  push:
    branches: [v0.5.16-repo-governance]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.16-repo-governance
          fetch-depth: 0

      - name: Audit and delete only proven merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          stale_branches=(
            noop-check
            noop-check-2
            v0.5.16-canonical-taxonomy
            v0.5.16-ci-browser-smoke
            v0.5.16-i18n-dynamic-closeout
            v0.5.16-keyed-i18n
            v0.5.16-keyed-i18n-legacy-bridge
            v0.5.16-live-outfit-sync
            v0.5.16-outfit-incomplete-integrity
            v0.5.16-outfit-live-ui-convergence
            v0.5.16-runtime-consolidation
            v0.5.16-state-after-cache
            v0.5.16-state-after-ci
            v0.5.16-state-after-i18n
            v0.5.16-state-after-runtime-consolidation
            v0.5.16-state-after-taxonomy
            v0.5.16-version-cache-normalization
          )

          pr51="$(gh pr view 51 --repo "$GITHUB_REPOSITORY" --json mergedAt,headRefOid)"
          pr51_merged="$(jq -r '.mergedAt // empty' <<<"$pr51")"
          pr51_head="$(jq -r '.headRefOid // empty' <<<"$pr51")"
          test -n "$pr51_merged"
          test "$pr51_head" = "78c3fb2d6df704a447555623dc4ec4b031ae6a43"

          for branch in "${stale_branches[@]}"; do
            current_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$current_sha" ]; then
              echo "Already absent: $branch"
              continue
            fi

            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
            if [ "$open_count" != "0" ]; then
              echo "REFUSE: $branch has $open_count open PR(s)."
              exit 1
            fi

            if [ "$branch" = "noop-check" ] || [ "$branch" = "noop-check-2" ]; then
              if [ "$current_sha" != "$pr51_head" ]; then
                echo "REFUSE: $branch no longer matches merged PR #51 head ($current_sha != $pr51_head)."
                exit 1
              fi
            else
              merged_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --head "$branch" --limit 100 --json number,mergedAt,headRefOid)"
              matching="$(jq --arg sha "$current_sha" '[.[] | select(.mergedAt != null and .headRefOid == $sha)] | length' <<<"$merged_json")"
              if [ "$matching" = "0" ]; then
                echo "REFUSE: $branch head $current_sha is not the exact head of a merged PR."
                echo "$merged_json"
                exit 1
              fi
            fi

            echo "DELETE proven merged branch: $branch @ $current_sha"
            git push origin --delete "$branch"
          done

          echo "Audited stale-branch cleanup complete."
