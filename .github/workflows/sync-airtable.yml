name: Sync Airtable closet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/sync-airtable.trigger'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: generated-main-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate and commit canonical snapshots safely
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          TARGET_BRANCH: main
          GENERATED_COMMIT_MESSAGE: Sync Airtable closet snapshots
          GENERATED_FILES: js/airtable-snapshot.js js/airtable-outfit-snapshot.js assets/items
          GENERATE_COMMAND: node scripts/sync-airtable.mjs && node scripts/sync-outfits.mjs
        run: bash scripts/commit-generated-artifacts.sh
