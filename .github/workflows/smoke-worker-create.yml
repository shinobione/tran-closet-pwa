name: Smoke test Worker create delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-worker-create.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Worker create and delete paths
        env:
          CLOSET_SYNC_KEY: ${{ secrets.CLOSET_SYNC_KEY }}
        run: |
          set -euo pipefail
          MID="smoke-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CREATE_BODY="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"mutations\":[{\"id\":\"$MID\",\"operation\":\"create\",\"localItemId\":\"smoke-local\",\"airtableRecordId\":null,\"payload\":{\"name\":\"__TRAN_CLOSET_SMOKE__\",\"category\":\"Bag\",\"colors\":[\"Red\"],\"styles\":[\"Classy\"],\"photo\":null}}]}" \
            'https://tran-closet-sync.jerryquinet.workers.dev/v1/mutations')"
          echo "CREATE: $CREATE_BODY"
          RECORD_ID="$(node -e 'const x=JSON.parse(process.argv[1]); const r=x.results?.[0]; if(!x.ok || !r?.ok || !r.airtableRecordId){console.error(JSON.stringify(x)); process.exit(1)} process.stdout.write(r.airtableRecordId)' "$CREATE_BODY")"
          DELETE_BODY="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOSET_SYNC_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"mutations\":[{\"id\":\"$MID-delete\",\"operation\":\"delete\",\"localItemId\":\"smoke-local\",\"airtableRecordId\":\"$RECORD_ID\",\"payload\":null}]}" \
            'https://tran-closet-sync.jerryquinet.workers.dev/v1/mutations')"
          echo "DELETE: $DELETE_BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !x.results?.[0]?.ok){console.error(JSON.stringify(x)); process.exit(1)}' "$DELETE_BODY"
          echo "Worker create -> Airtable -> delete verified"
