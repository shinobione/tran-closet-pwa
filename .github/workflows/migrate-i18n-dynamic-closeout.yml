name: Migrate V0.5.16 dynamic i18n closeout

on:
  push:
    branches: [v0.5.16-i18n-dynamic-closeout]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip dynamic-i18n-migrate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.16-i18n-dynamic-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded migration
        run: node scripts/migrate-i18n-dynamic-closeout.mjs
      - name: Validate migrated JavaScript
        run: |
          node --check js/duplicate-core.mjs
          node --check js/duplicate-guard.js
          node --check js/item-ai-assistant.js
          node --check js/i18n-keyed.mjs
          node --check js/app.js
          node --check js/i18n.js
          node --check worker/src/index.js
          node scripts/test-duplicate-core.mjs
          node scripts/test-keyed-i18n.mjs
          ! grep -q "observer.observe(document.body,{subtree:true" js/i18n.js
          grep -q "TranClosetI18n?.apply" js/app.js
          grep -q "language:currentLanguage()" js/item-ai-assistant.js
          grep -q "outputLanguage=language==='fr'?'French':'Vietnamese'" worker/src/index.js
      - name: Remove one-shot machinery
        run: |
          rm scripts/migrate-i18n-dynamic-closeout.mjs
          rm .github/workflows/migrate-i18n-dynamic-closeout.yml
      - name: Commit migrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V0.5.16 · Close dynamic i18n observer debt [skip dynamic-i18n-migrate]"
          git push origin HEAD:v0.5.16-i18n-dynamic-closeout
